rules:
  - id: claude.php.wordpress.access-control.empty-secret-jwt-validation
    languages: [php]
    severity: HIGH
    message: |
      JWT::decode() is called with a signing key retrieved from get_option() without
      first checking whether the option value is empty or false. When the option has
      not been configured (returns false/empty string), the JWT library may accept
      tokens signed with an empty secret, allowing an attacker to forge valid JWTs
      by signing with an empty key (CWE-1390). Always validate that the secret is
      non-empty before passing it to JWT::decode(): add an explicit empty() or
      falsy check and abort with an error if the secret is not configured.
    metadata:
      category: security
      cwe: "CWE-1390: Weak Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/1390.html
        - https://github.com/firebase/php-jwt
    patterns:
      - pattern: |
          $SECRET = get_option(...);
          ...
          JWT::decode($TOKEN, new Key($SECRET, ...));
      - pattern-not: |
          $SECRET = get_option(...);
          ...
          if (empty($SECRET)) { ... }
          ...
          JWT::decode($TOKEN, new Key($SECRET, ...));
      - pattern-not: |
          $SECRET = get_option(...);
          ...
          if (!$SECRET) { ... }
          ...
          JWT::decode($TOKEN, new Key($SECRET, ...));
