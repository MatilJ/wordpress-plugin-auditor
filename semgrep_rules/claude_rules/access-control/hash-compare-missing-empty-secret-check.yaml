rules:
  - id: claude.php.wordpress.access-control.hash-compare-missing-empty-secret-check
    languages: [php]
    severity: HIGH
    message: |
      A client-supplied value ($_COOKIE/$_GET/$_POST/$_REQUEST) is compared
      against md5()/sha1() of a stored secret (option, post meta, or property)
      with no preceding check that the secret is actually non-empty (CWE-287:
      Improper Authentication). If the secret has never been configured,
      get_option() or the equivalent typically returns an empty string, and
      md5('')/sha1('') resolve to the well-known constants
      d41d8cd98f00b204e9800998ecf8427e / da39a3ee5e6b4b0d3255bfef95601890afd80709.
      Any visitor who submits that constant value satisfies the comparison and
      bypasses the check on every installation where the secret is unset — the
      plugin's default, unconfigured state.

      TRIAGE: confirm the secret variable is genuinely reachable in an unset/
      empty state on a stock installation (not written by any save handler, or
      only conditionally written). If a strlen()/!empty() guard on the secret
      exists anywhere in the same condition or an enclosing if, this is a false
      positive. Also check the CALL graph, not just the immediate function: a
      common safe pattern splits the guard and the comparison into two separate
      functions (a "locked" wrapper that checks strlen() before calling an
      "unlocked" helper that does the raw comparison) — this rule cannot see
      across that function boundary and will flag the helper's comparison even
      though every call site is guarded.

      Fix: require strlen($secret) > 0 (or !empty($secret)) before trusting the
      hash comparison, and use hash_equals() instead of == for the comparison
      itself.
    metadata:
      category: security
      cwe: "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://www.php.net/manual/en/function.hash-equals.php
    patterns:
      - pattern-either:
          - pattern: $_COOKIE[$K] == md5($SECRET)
          - pattern: $_COOKIE[$K] == sha1($SECRET)
          - pattern: $_GET[$K] == md5($SECRET)
          - pattern: $_GET[$K] == sha1($SECRET)
          - pattern: $_POST[$K] == md5($SECRET)
          - pattern: $_POST[$K] == sha1($SECRET)
          - pattern: $_REQUEST[$K] == md5($SECRET)
          - pattern: $_REQUEST[$K] == sha1($SECRET)
      # Deep-match (not a fixed 2-operand shape) so any N-way &&-chain ordering
      # or nesting around the guard still counts, e.g. A && B && guard && sink.
      - pattern-not-inside: |
          if (<... strlen($SECRET) > 0 ...>) { ... }
      - pattern-not-inside: |
          if (<... !empty($SECRET) ...>) { ... }
      - pattern-not-inside: |
          if (<... $SECRET !== '' ...>) { ... }
      - pattern-not-inside: |
          if (<... $SECRET != '' ...>) { ... }
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
