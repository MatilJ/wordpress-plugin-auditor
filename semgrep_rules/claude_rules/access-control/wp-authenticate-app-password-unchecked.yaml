rules:
  - id: claude.php.wordpress.access-control.wp-authenticate-app-password-unchecked
    languages: [php]
    severity: HIGH
    message: |
      wp_authenticate_application_password() is called, but its return value is not
      checked with is_wp_error() or instanceof WP_User before use. This function
      returns a WP_User on success or a WP_Error on failure — if the error case is
      not handled, the code may proceed with an invalid authentication state.

      When the return value is used without validation (e.g., accessing $user->ID),
      failed authentication attempts are silently treated as successful. Depending on
      the surrounding logic, this can allow unauthenticated access to protected
      endpoints or cause PHP fatal errors that leak information.

      CVE-2026-8181 (Burst Statistics): the plugin called
      wp_authenticate_application_password() but did not check for WP_Error,
      allowing unauthenticated API access. CVE-2025-27007 (OttoKit): similar
      pattern where unchecked application password authentication led to
      privilege escalation.

      Fix: always check is_wp_error($user) immediately after calling
      wp_authenticate_application_password() and return an error response
      if authentication failed.
    metadata:
      category: security
      cwe: "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/wp_authenticate_application_password/
        - https://www.wordfence.com/threat-intel/vulnerabilities/wordpress-plugins/developer-flavor/burst-statistics-privacy-friendly-analytics-for-wordpress-1131-authentication-bypass
    patterns:
      - pattern: |
          function $FUNC(...) {
            ...
            $USER = wp_authenticate_application_password(...);
            ...
          }
      - pattern-not: |
          function $FUNC(...) {
            ...
            $USER = wp_authenticate_application_password(...);
            ...
            if (is_wp_error($USER)) { ... }
            ...
          }
      - pattern-not: |
          function $FUNC(...) {
            ...
            $USER = wp_authenticate_application_password(...);
            ...
            if (!($USER instanceof WP_User)) { ... }
            ...
          }
