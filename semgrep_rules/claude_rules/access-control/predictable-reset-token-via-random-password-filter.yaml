rules:
  - id: claude.php.wordpress.access-control.predictable-reset-token-via-random-password-filter
    languages: [php]
    severity: CRITICAL
    message: |
      A callback hooked onto WordPress core's `random_password` filter
      unconditionally overwrites the generated value with raw, unauthenticated
      request data ($_POST/$_GET/$_REQUEST/$_COOKIE), with no check that
      restricts the override to a specific, already-trusted context.

      WP Core applies `random_password` inside wp_generate_password()
      (wp-includes/pluggable.php), a general-purpose "give me an unpredictable
      string" primitive used far beyond any one plugin's own feature. Most
      critically, get_password_reset_key() (wp-includes/user.php) calls
      wp_generate_password(20, false) to mint the value that is supposed to be
      an unguessable password-reset key. Hooking `random_password` to blindly
      trust request data poisons EVERY call site process-wide: an
      unauthenticated attacker can submit the standard "lost password" request
      for any victim account while also sending a value they chose (e.g.
      user_pass) in the same request; the filter callback returns that
      attacker-known value as the "random" reset key. WordPress hashes and
      stores it as if it were secret, but the attacker already knows it and
      can build a valid password-reset link themselves and take over the
      account without ever seeing the reset email (CWE-269 / CWE-330 —
      Improper Privilege Management via a predictable/attacker-supplied
      security token).

      Fix: never let a value-generation filter that WordPress core or other
      code relies on for unpredictability be overridden by request data.
      Confine "let the user pick their own password" logic to a verified,
      single-purpose hook instead — e.g. call wp_set_password($password,
      $user_id) from a register_new_user callback, where $user_id is supplied
      by WordPress core for the user that was just created, never sourced
      from the request, and the write cannot affect any other user or any
      unrelated wp_generate_password() call site (such as password reset).

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - add_filter('random_password', ...) callback returns/sets its value
          straight from $_POST/$_GET/$_REQUEST/$_COOKIE (optionally through
          wp_unslash()/sanitize_text_field()) with no context check.
        - No verification that the current request is the exact registration
          submission the feature is meant for (e.g. no check on the current
          action/hook, no nonce belonging to that specific form).

      FALSE POSITIVE indicators:
        - The password-choice logic lives in a register_new_user (or similar
          single-purpose, core-supplied) action callback and calls
          wp_set_password($password, $user_id) directly, where $user_id
          comes from the hook's own argument — this never touches
          wp_generate_password()/random_password and cannot affect the
          password-reset-key generator.
        - The random_password callback only tweaks length/charset/complexity
          and never reads request data.
        - A capability or nonce check gates the override to a legitimate,
          already-authenticated context.
    metadata:
      category: security
      cwe: "CWE-269: Improper Privilege Management"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Privilege Escalation"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/269.html
        - https://cwe.mitre.org/data/definitions/330.html
        - https://developer.wordpress.org/reference/functions/wp_generate_password/
        - https://developer.wordpress.org/reference/functions/get_password_reset_key/
    patterns:
      - pattern: $PASSWORD = $SRC;
      - pattern-either:
          - pattern-inside: |
              function $CALLBACK($PASSWORD) {
                ...
              }
          - pattern-inside: |
              function ($PASSWORD) {
                ...
              }
      - pattern-either:
          - pattern-inside: |
              class $CLASS {
                ...
                function $ANYMETHOD(...) {
                  ...
                  add_filter('random_password', ...);
                  ...
                }
                ...
              }
          - pattern-inside: |
              add_filter('random_password', ...);
              ...
          - pattern-inside: |
              add_filter('random_password', function ($PASSWORD) {
                ...
              });
          - patterns:
              - pattern-inside: |
                  function $CALLBACK($PASSWORD) {
                    ...
                  }
              - metavariable-regex:
                  metavariable: $CALLBACK
                  regex: (?i)^.*(random_password|generate_password)[a-z0-9_]*$
      - metavariable-pattern:
          metavariable: $SRC
          patterns:
            - pattern-either:
                - pattern: $_POST[...]
                - pattern: $_GET[...]
                - pattern: $_REQUEST[...]
                - pattern: $_COOKIE[...]
                - pattern: wp_unslash($_POST[...])
                - pattern: wp_unslash($_GET[...])
                - pattern: wp_unslash($_REQUEST[...])
                - pattern: stripslashes($_POST[...])
                - pattern: sanitize_text_field($_POST[...])
                - pattern: sanitize_text_field(wp_unslash($_POST[...]))
                - pattern: $WRAP($_POST[...])
                - pattern: $WRAP($_GET[...])
                - pattern: $WRAP($_REQUEST[...])
                - pattern: $WRAP($_COOKIE[...])
      - pattern-not-inside: |
          function $CALLBACK(...) {
            ...
            if (<... current_user_can(...) ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $CALLBACK(...) {
            ...
            if (<... did_action(...) ...>)
              return $PASSWORD;
            ...
          }
      - pattern-not-inside: |
          function $CALLBACK(...) {
            ...
            wp_verify_nonce(...);
            ...
          }
