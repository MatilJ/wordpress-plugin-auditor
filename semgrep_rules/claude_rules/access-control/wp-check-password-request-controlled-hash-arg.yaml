rules:
  - id: claude.php.wordpress.access-control.wp-check-password-request-controlled-hash-arg
    languages: [php]
    severity: HIGH
    message: |
      wp_check_password() is called with its second argument (the "hash" to
      check against) sourced from request-controlled input
      ($_COOKIE/$_GET/$_POST/$_REQUEST) — either directly, through a
      one-parameter indirection (a helper function receives the value and
      passes its own parameter straight through), or via a local variable
      assigned from the superglobal earlier in the same function.

      WordPress Core's wp_check_password() (wp-includes/pluggable.php)
      contains a legacy-compatibility branch that runs BEFORE any
      bcrypt/phpass verification: when the supplied hash string is 32
      characters or fewer, it falls back to a plain
      hash_equals($hash, md5($password)) comparison, regardless of the
      site's actual password-hashing mechanism.

      Because the attacker fully controls the hash argument, they can submit
      any string 32 characters or shorter to force this legacy branch. The
      check then only verifies that md5($password) equals that
      attacker-supplied string — i.e. the attacker just needs to submit
      md5($password) themselves. If the first argument ($password) is not a
      genuine per-installation secret unknown to the attacker — e.g. a public
      value like site_url()/home_url(), a fixed string, or anything else the
      attacker can independently compute or observe — the attacker passes the
      check with zero knowledge of any real credential (CWE-287 / CWE-347).

      Fix: never accept the comparison hash from the request. Generate a
      cryptographically random secret server-side, store it, and compare the
      request-supplied token to the STORED secret with hash_equals() — the
      request should only ever supply the raw token, never the "hash"
      argument of wp_check_password().
    metadata:
      category: security
      cwe:
        - "CWE-287: Improper Authentication"
        - "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://cwe.mitre.org/data/definitions/347.html
        - https://developer.wordpress.org/reference/functions/wp_check_password/
      # TRIAGE GUIDANCE — this rule flags the PRECONDITION (attacker supplies
      # the hash-comparison argument); it cannot itself verify whether the
      # first argument has a secret component. Confirm before reporting:
      #
      # TRUE POSITIVE — the first argument ($password) is a value with no
      # secret component: a fixed string, a public URL/host value
      # (site_url(), home_url(), $_SERVER['HTTP_HOST']), a hardcoded
      # constant, or anything else the attacker can already know or compute
      # without having compromised the site.
      #
      # FALSE POSITIVE — the first argument itself embeds a genuine secret
      # the attacker does not know (a stored password, a random per-user
      # token, an API key). Forging a matching short hash would then require
      # already knowing that secret, defeating the point of the attack.
      #
      # FALSE POSITIVE — the stored hash this call ultimately verifies is
      # always produced by wp_hash_password()/password_hash() (always well
      # over 32 characters), so the short-hash MD5 fallback can never
      # trigger regardless of what reaches the second argument.
      #
      # The "bare parameter" and "local variable from superglobal" branches
      # below are pattern-based (not true interprocedural taint) — they
      # match the SHAPE of a request value reaching this call one hop away,
      # which is sufficient to require the same manual confirmation as a
      # direct hit.
    patterns:
      - pattern-either:
          # Branch 1: direct superglobal read at the call site (optionally
          # wrapped by 1-2 function calls, e.g. sanitize_text_field()).
          - patterns:
              - pattern-either:
                  # Namespaced plugin classes commonly call this WP Core
                  # global-namespace function with a leading backslash
                  # (\wp_check_password(...)); Semgrep's PHP call pattern does
                  # NOT match across that prefix difference, so both forms
                  # must be listed explicitly or the bare form silently misses
                  # every fully-qualified call site.
                  - pattern: wp_check_password($X, $Y, ...)
                  - pattern: \wp_check_password($X, $Y, ...)
              - metavariable-pattern:
                  metavariable: $Y
                  patterns:
                    - pattern-either:
                        - pattern: $_COOKIE[$K]
                        - pattern: $_GET[$K]
                        - pattern: $_POST[$K]
                        - pattern: $_REQUEST[$K]
                        - pattern: $FN($_COOKIE[$K])
                        - pattern: $FN($_GET[$K])
                        - pattern: $FN($_POST[$K])
                        - pattern: $FN($_REQUEST[$K])
                        - pattern: $FN($FN2($_COOKIE[$K]))
                        - pattern: $FN($FN2($_GET[$K]))
                        - pattern: $FN($FN2($_POST[$K]))
                        - pattern: $FN($FN2($_REQUEST[$K]))
          # Branch 2: one-hop parameter indirection — a helper function
          # receives the request value as its own parameter and passes it
          # straight through as the hash argument (the shape used by an
          # internal "is_bypass_request_valid($token)"-style validator whose
          # public caller reads the actual $_GET/$_POST/$_COOKIE value).
          - patterns:
              - pattern-inside: |
                  function $FUNC(..., $Y, ...) {
                    ...
                  }
              - pattern-either:
                  # Namespaced plugin classes commonly call this WP Core
                  # global-namespace function with a leading backslash
                  # (\wp_check_password(...)); Semgrep's PHP call pattern does
                  # NOT match across that prefix difference, so both forms
                  # must be listed explicitly or the bare form silently misses
                  # every fully-qualified call site.
                  - pattern: wp_check_password($X, $Y, ...)
                  - pattern: \wp_check_password($X, $Y, ...)
          # Branch 3: local variable assigned from a superglobal earlier in
          # the same function (directly, or via the common
          # isset($_X[...]) ? $_X[...] : $default guard idiom), then used as
          # the hash argument.
          - patterns:
              - pattern-inside: |
                  function $FUNC(...) {
                    ...
                    $Y = $SRC;
                    ...
                  }
              - pattern-either:
                  # Namespaced plugin classes commonly call this WP Core
                  # global-namespace function with a leading backslash
                  # (\wp_check_password(...)); Semgrep's PHP call pattern does
                  # NOT match across that prefix difference, so both forms
                  # must be listed explicitly or the bare form silently misses
                  # every fully-qualified call site.
                  - pattern: wp_check_password($X, $Y, ...)
                  - pattern: \wp_check_password($X, $Y, ...)
              - metavariable-pattern:
                  metavariable: $SRC
                  patterns:
                    - pattern-either:
                        - pattern: $_COOKIE[$K]
                        - pattern: $_GET[$K]
                        - pattern: $_POST[$K]
                        - pattern: $_REQUEST[$K]
                        - pattern: "(isset($_COOKIE[$K]) ? $_COOKIE[$K] : $DEFAULT)"
                        - pattern: "(isset($_GET[$K]) ? $_GET[$K] : $DEFAULT)"
                        - pattern: "(isset($_POST[$K]) ? $_POST[$K] : $DEFAULT)"
                        - pattern: "(isset($_REQUEST[$K]) ? $_REQUEST[$K] : $DEFAULT)"
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
