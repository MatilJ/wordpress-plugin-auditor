rules:
  - id: claude.php.wordpress.access-control.password-reset-dispatch-no-session-gate
    languages: [php]
    severity: CRITICAL
    message: |
      A request dispatcher routes directly to a password/credential-reset
      handler based solely on an equality match against a $_REQUEST/$_POST
      value (a routing/"which form action is this" selector), with no
      reference to any session/transient verification-state value anywhere
      in that same gating condition (CWE-287: Improper Authentication /
      CWE-640: Weak Password Recovery Mechanism for Forgotten Password).

      This is a decoupling bug, not a missing-feature bug: the plugin
      typically DOES implement an OTP/recovery-code verification step
      earlier in the same multi-request flow, but the dispatcher that
      finally invokes the mutating handler never re-checks that step's
      outcome — it relies purely on a routing value that any visitor can
      supply on a fresh, unauthenticated request. When the account identity
      the handler acts on is resolved from state set earlier in the SAME
      unauthenticated flow (e.g. as soon as a phone number/username was
      submitted to start the flow, before any code was verified), an
      attacker can start the flow for a known victim account and then skip
      straight to the mutating dispatch call, bypassing verification
      entirely.

      Fix: require the dispatch condition to ALSO check a session/transient
      flag that is set to a specific "verified"/"validated" sentinel value
      ONLY by the real verification-success code path, and compare against
      that exact value (a bare isset()/!empty() presence check on the key
      is not sufficient if the same key can also be set, to any value,
      earlier in the flow before verification happens).

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - The dispatch condition's only check is a $_REQUEST/$_POST value
          (optionally passed through sanitize_text_field()/wp_unslash())
          compared against a hardcoded string literal that names a
          password/credential-reset routing action.
        - No comparison of a $_SESSION (or transient) value against a
          specific sentinel appears anywhere in that same condition.
        - The handler invoked in the block performs, itself or via a
          function it directly calls, a password/credential mutation using
          an identity resolved from session/stored flow state rather than a
          value the request independently proves ownership of in this same
          call.

      FALSE POSITIVE indicators:
        - The same condition ALSO compares a session/transient value against
          a specific verified/validated sentinel (not just isset()/!empty()
          on the key), set only by the genuine verification-success code
          path.
        - The handler invoked performs no credential/password mutation (it
          only re-displays a form, logs an attempt, or reads status).
        - The account acted on inside the handler is always
          get_current_user_id() (a logged-in self-service action), not
          resolved from unauthenticated flow state.
    metadata:
      category: security
      cwe:
        - "CWE-287: Improper Authentication"
        - "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: CRITICAL
      subcategory: vuln
      vulnerability_class: "Authentication Bypass / Account Takeover"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://cwe.mitre.org/data/definitions/640.html
        - https://developer.wordpress.org/reference/functions/check_password_reset_key/
    patterns:
      - pattern-either:
          - pattern: |
              if (<... $_REQUEST[$KEY] === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... $_REQUEST[$KEY] == $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... sanitize_text_field(wp_unslash($_REQUEST[$KEY])) === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... sanitize_text_field($_REQUEST[$KEY]) === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... wp_unslash($_REQUEST[$KEY]) === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... $_POST[$KEY] === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... $_POST[$KEY] == $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
          - pattern: |
              if (<... sanitize_text_field(wp_unslash($_POST[$KEY])) === $LITERAL ...>) {
                ...
                $OBJ->$HANDLER(...);
                ...
              }
      - metavariable-regex:
          metavariable: $HANDLER
          regex: (?i)^\w*(change|reset|update|set)\w*(pass|pwd|password|credential)\w*$
      # FP guard — the real fix shape: the SAME dispatch condition also
      # compares a session value against a specific verified/validated
      # sentinel, not just a bare presence check on the key.
      - pattern-not: |
          if (<... strcasecmp($_SESSION[$SESSVAR], $STATE) === 0 ...>) {
            ...
            $OBJ->$HANDLER(...);
            ...
          }
      - pattern-not: |
          if (<... $_SESSION[$SESSVAR] === $STATE ...>) {
            ...
            $OBJ->$HANDLER(...);
            ...
          }
      - pattern-not: |
          if (<... $_SESSION[$SESSVAR] == $STATE ...>) {
            ...
            $OBJ->$HANDLER(...);
            ...
          }
      - pattern-not: |
          if (<... hash_equals($_SESSION[$SESSVAR], $STATE) ...>) {
            ...
            $OBJ->$HANDLER(...);
            ...
          }
      - pattern-not: |
          if (<... hash_equals($STATE, $_SESSION[$SESSVAR]) ...>) {
            ...
            $OBJ->$HANDLER(...);
            ...
          }
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
