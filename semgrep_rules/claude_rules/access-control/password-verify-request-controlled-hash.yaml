rules:
  - id: claude.php.wordpress.access-control.password-verify-request-controlled-hash
    languages: [php]
    severity: HIGH
    message: |
      password_verify() is called with its second argument (the "known hash" to
      check against) sourced directly from request-controlled input
      ($_COOKIE/$_GET/$_POST/$_REQUEST), optionally passed through a wrapper or
      sanitizer call first. password_verify()'s second argument is meant to be a
      hash the server already computed and stored at creation time (in a
      transient, option, or DB row) — not a value the current request supplies.
      Because password_hash() embeds a fresh random salt in every hash string it
      produces, an attacker does not need to observe the server's original hash:
      they can locally compute password_hash() of any plaintext they already
      know or can guess (e.g. a low-entropy identifier such as a post/entry ID
      concatenated with a user ID, which is 0 for a logged-out visitor) and
      submit that self-minted hash as the cookie/parameter value.
      password_verify() will accept it, since it only checks that the plaintext
      matches the supplied hash string — not that the hash is the one the
      server actually issued (CWE-287). This grants unauthenticated access to
      whatever resource the check gates.

      Fix: never accept the comparison hash from the request. Generate a
      cryptographically random secret server-side (wp_generate_password(32,
      false) or random_bytes()), store it keyed to the resource (get_transient/
      set_transient, a DB column, user/post meta), and compare the
      request-supplied token to the stored secret with hash_equals()
      (timing-safe) — the request should only ever supply the raw token, never
      the "hash" side of the comparison.
    metadata:
      category: security
      cwe: "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://www.php.net/manual/en/function.password-verify.php
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
    patterns:
      - pattern: password_verify($X, $Y)
      - metavariable-pattern:
          metavariable: $Y
          patterns:
            - pattern-either:
                - pattern: $_COOKIE[$K]
                - pattern: $_GET[$K]
                - pattern: $_POST[$K]
                - pattern: $_REQUEST[$K]
                - pattern: $FN($_COOKIE[$K])
                - pattern: $FN($_GET[$K])
                - pattern: $FN($_POST[$K])
                - pattern: $FN($_REQUEST[$K])
                - pattern: $FN($FN2($_COOKIE[$K]))
                - pattern: $FN($FN2($_GET[$K]))
                - pattern: $FN($FN2($_POST[$K]))
                - pattern: $FN($FN2($_REQUEST[$K]))
