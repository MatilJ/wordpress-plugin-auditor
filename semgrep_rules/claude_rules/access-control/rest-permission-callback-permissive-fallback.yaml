rules:
  - id: claude.php.wordpress.access-control.rest-permission-callback-permissive-fallback
    languages: [php]
    severity: HIGH
    message: |
      A REST route permission_callback reads a request header (typically a webhook
      signature) but returns true unconditionally when a configuration value is empty,
      bypassing all signature/HMAC verification (CWE-345). When the signing secret
      is not yet configured — a common state during initial setup or after a settings
      reset — any unauthenticated caller can pass the permission gate and reach the
      route handler with a fully attacker-controlled payload.

      Pattern: `if (empty($signing_secret)) { return true; }` inside the
      permission_callback, before any call to hash_hmac() or hash_equals(). This is
      the "fails open on missing config" antipattern for webhook signature verification.

      Fix: return false (or a WP_Error) when the signing secret is not configured,
      forcing the site operator to complete setup before the endpoint accepts events.
    metadata:
      category: security
      cwe: "CWE-345: Insufficient Verification of Data Authenticity"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Missing Cryptographic Signature Verification"
      technology: [php, wordpress]
      references:
        - https://stripe.com/docs/webhooks/signatures
        - https://developer.wordpress.org/rest-api/extending-the-rest-api/adding-custom-endpoints/#permissions-callback
        - https://cwe.mitre.org/data/definitions/345.html
      # TRIAGE GUIDANCE:
      #
      # TRUE POSITIVE — fails open when no signing secret configured:
      #   The function reads a signature header from $request and has:
      #     if (empty($signing_secret)) { return true; }
      #   before any HMAC/SDK verification. When the secret is absent, the caller
      #   passes the permission gate without any cryptographic check.
      #
      # FALSE POSITIVE — returns false on empty config (strict / secure):
      #   if (empty($signing_secret)) { return false; }
      #   or: if (empty($candidates)) { return new WP_Error('...', '...', 403); }
      #   These fail closed — the endpoint rejects calls when not configured.
      #   This rule does NOT fire on return-false patterns.
      #
      # FALSE POSITIVE — empty check on user capability, not a secret:
      #   if (empty($user_caps)) { return true; }
      #   If $user_caps comes from current_user_can() or a role array rather than
      #   a signing secret option, this may be a legitimate permission pattern.
      #   Check whether the function also reads $request->get_header() for a
      #   webhook signature — that distinguishes webhook gate functions.
    # Freemius SDK is bundled third-party; out of scope for Wordfence bounty.
    paths:
      exclude:
        - "**/freemius/**"
    patterns:
      # Function reads a webhook signature header from the request object.
      # This distinguishes webhook permission_callback functions from generic
      # REST permission helpers that never touch signature headers.
      - pattern: |
          function $FUNC(...) {
            ...
            $request->get_header(...);
            ...
          }
      # Function has an empty-config branch that returns true — fails open.
      - pattern: |
          function $FUNC(...) {
            ...
            if (empty($X)) {
              ...
              return true;
              ...
            }
            ...
          }
      # NOTE: hash_hmac and hash_equals are intentionally NOT excluded here.
      # A function can contain hash_hmac/hash_equals in the non-empty branch but
      # still be vulnerable because the if (empty($X)) { return true; } guard
      # fires BEFORE those calls, bypassing all verification when no secret is set.
      # Excluding hash_hmac would produce false negatives for this common pattern:
      #   if (empty($secret)) { return true; }  ← bypass path
      #   $expected = hash_hmac('sha256', $body, $secret);  ← never reached when bypass fires
      #   return hash_equals($expected, $sig);
      # Exclude functions that delegate to a WP nonce check — these are AJAX handlers
      # that read the body as JSON, not webhook signature verifiers.
      - pattern-not: |
          function $FUNC(...) {
            ...
            <... check_ajax_referer(...) ...>;
            ...
          }
      - pattern-not: |
          function $FUNC(...) {
            ...
            <... wp_verify_nonce(...) ...>;
            ...
          }
