rules:
  - id: claude.php.wordpress.access.user-input-to-wp-set-password
    mode: taint
    languages: [php]
    severity: CRITICAL
    message: |
      User-controlled input flows into the $user_id argument of
      wp_set_password(). An attacker can reset any user's password
      including the administrator's (CWE-620 — Unverified Password Change).

      WP Core: wp_set_password($password, $user_id) at pluggable.php:3099
      directly updates the user_pass column in wp_users and clears the
      activation key. No authorization check inside the function.

      The standard WordPress password reset flow uses:
      get_password_reset_key() -> email -> check_password_reset_key() ->
      reset_password(). Custom flows that skip check_password_reset_key()
      are vulnerable.

      Fix: verify ownership with current_user_can('edit_user', $user_id)
      or use the standard WP password reset token flow.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - user_id comes from POST/GET/REQUEST without edit_user check
        - Custom password reset that skips check_password_reset_key()
        - No token/email verification before the password change

      FALSE POSITIVE indicators:
        - current_user_can('edit_user', $user_id) check present
        - user_id is get_current_user_id() (self-change, check auth)
        - Standard WP reset flow with check_password_reset_key()
    metadata:
      category: security
      cwe: "CWE-620: Unverified Password Change"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Account Takeover"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/wp_set_password/
        - https://patchstack.com/academy/wordpress/vulnerabilities/privilege-escalation/
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: file_get_contents("php://input")
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: $REQUEST->get_body()
    pattern-sinks:
      - patterns:
          - pattern: wp_set_password($PASS, $USER_ID)
          - focus-metavariable: $USER_ID
