rules:
  - id: claude.php.wordpress.access-control.self-minted-option-token-credential-sink
    languages: [php]
    severity: HIGH
    message: |
      A function reads a value stored via get_option()/get_site_option(),
      compares it strictly (===) against request-derived input, and — only
      on match — invokes a credential-linkage sink (a login/connect/
      authorize/authenticate-named function or method call) — with no
      wp_verify_nonce(), current_user_can(), or is_user_logged_in() call
      anywhere in the function (CWE-287 / CWE-862).

      This differs from a genuine nonce check: wp_verify_nonce() binds a
      token to both a specific action string and (for logged-in callers) the
      issuing user's own session, and rejects anyone who did not receive
      that exact token from WordPress itself. A homegrown "compare against a
      stored option" re-implementation has neither property. If ANY
      reachable code path in the same plugin can mint (wp_create_nonce(),
      wp_generate_password(), a raw hash/uniqid(), etc.) and persist that
      SAME option under conditions the caller themselves can trigger — an
      unauthenticated GET request, a public redirect whose target embeds the
      freshly-generated value — even from a completely different function,
      the "secret" carries zero authorization value: the caller can always
      obtain a fresh, valid value by generating it themselves immediately
      before use. This is a distinct root cause from the classic
      "empty-secret" bypass (comparing against an unconfigured/empty
      default): here the value is fully populated and the comparison is
      correctly strict, but the token-issuance and token-verification steps
      share no binding to the caller's own identity or session.

      TRIAGE REQUIRED:
      1. Confirm this function (or the REST route / AJAX action it is wired
         to) is reachable by an unauthenticated or low-privilege caller —
         search for register_rest_route()/add_action('wp_ajax_nopriv_...')/
         permission_callback wiring referencing this function or method.
      2. Find where the compared option is WRITTEN (update_option(),
         add_option(), update_site_option()). If the write only ever happens
         from a trusted, non-attacker-reachable context (an admin-only
         settings save, a value baked in at plugin activation), this is a
         FALSE POSITIVE — the option functions as a real secret.
      3. Confirm the write path is itself reachable by the same or a
         lower-privileged caller — directly, or via a public redirect/
         response that discloses the freshly-written value back to the
         requester — which is what makes the "secret" self-service rather
         than externally issued.
      4. Confirm the sink's real-world impact — what stored state does the
         credential-linkage call actually change (an access token, a role, a
         connected third-party account)?

      Remediation: replace the option comparison with wp_create_nonce($action)
      / wp_verify_nonce($token, $action) bound to a specific, unforgeable
      action string AND the caller's own authenticated identity, or require
      current_user_can() at an appropriate capability level before the sink
      is reached.
    metadata:
      category: security
      cwe:
        - "CWE-287: Improper Authentication"
        - "CWE-862: Missing Authorization"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: LOW
      likelihood: MEDIUM
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://cwe.mitre.org/data/definitions/862.html
        - https://developer.wordpress.org/apis/security/nonces/
    patterns:
      - pattern-either:
          # Bare-function-call sink, stored value on the left of ===
          - pattern: |
              function $FUNC(...) {
                ...
                $SECRET = $GETTER($KEY);
                ...
                if (<... $SECRET === $INPUT ...>) {
                  ...
                  $SINK(...);
                  ...
                }
                ...
              }
          # Bare-function-call sink, stored value on the right of ===
          - pattern: |
              function $FUNC(...) {
                ...
                $SECRET = $GETTER($KEY);
                ...
                if (<... $INPUT === $SECRET ...>) {
                  ...
                  $SINK(...);
                  ...
                }
                ...
              }
          # Method/chained-call sink (e.g. Class::get_instance()->login(...)),
          # stored value on the left of ===
          - pattern: |
              function $FUNC(...) {
                ...
                $SECRET = $GETTER($KEY);
                ...
                if (<... $SECRET === $INPUT ...>) {
                  ...
                  $RECEIVER->$SINK(...);
                  ...
                }
                ...
              }
          # Method/chained-call sink, stored value on the right of ===
          - pattern: |
              function $FUNC(...) {
                ...
                $SECRET = $GETTER($KEY);
                ...
                if (<... $INPUT === $SECRET ...>) {
                  ...
                  $RECEIVER->$SINK(...);
                  ...
                }
                ...
              }
      - metavariable-regex:
          metavariable: $GETTER
          regex: '^(get_option|get_site_option)$'
      # Scoped to option keys that look like a self-service verification
      # token — the class of bug this rule targets — rather than any
      # arbitrary stored-value comparison.
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(nonce|token|secret|otp|verif|auth|code|hash).*
      - metavariable-regex:
          metavariable: $SINK
          regex: (?i)^(login|connect|authorize|authenticate|link_account|do_login|process_login)\w*$
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_verify_nonce(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... wp_verify_nonce(...) ...>) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            current_user_can(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... current_user_can(...) ...>) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            is_user_logged_in();
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... is_user_logged_in() ...>) {
              ...
            }
            ...
          }
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
