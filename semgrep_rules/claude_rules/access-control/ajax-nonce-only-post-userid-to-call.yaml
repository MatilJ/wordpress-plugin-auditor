rules:
  - id: claude.php.wordpress.access-control.ajax-nonce-only-post-userid-to-call
    languages: [php]
    severity: MEDIUM
    message: |
      An AJAX handler verifies a nonce (check_ajax_referer) but then reads an
      integer user ID from a POST parameter and passes it as the first argument
      to a static or instance method call without an ownership check
      (current_user_can('edit_user', $user_id)). Any logged-in user who can obtain
      the nonce can supply an arbitrary user ID, targeting other users' accounts
      including administrators (CWE-862 Missing Authorization / IDOR).

      This rule complements ajax-post-user-id-to-user-meta-write: it catches
      cases where the user ID flows into a plugin wrapper function rather than
      directly into update_user_meta / delete_user_meta / add_user_meta.

      Fix: verify ownership before any per-user write operation:
        if ( ! current_user_can( 'edit_user', (int) $user_id ) ) {
            wp_send_json_error( 'Unauthorized', 403 );
        }

      TRIAGE GUIDANCE:
        TRUE POSITIVE: handler registered on wp_ajax_ (authenticated), nonce is
          localized on a public/subscriber-accessible page, $user_id used to
          modify or delete another user's data via the called method.
        FALSE POSITIVE: $user_id comes from get_current_user_id() in practice
          (the POST parameter is always the current user's own ID and the handler
          applies only a self-write with no cross-user impact).
        FALSE POSITIVE: called method only performs a read, not a write.
        FALSE POSITIVE: handler has a manage_options or edit_users capability
          check (those are excluded by this rule but verify the exact pattern).
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      likelihood: HIGH
      impact: MEDIUM
      subcategory: audit
      vulnerability_class: "Missing Authorization"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/apis/security/nonces/
        - https://developer.wordpress.org/reference/functions/current_user_can/
        - https://www.wordfence.com/blog/2023/02/authorization-vs-intent-why-you-should-always-verify-both/
    # Freemius SDK is bundled third-party; out of scope for Wordfence bounty.
    paths:
      exclude:
        - "**/freemius/**"
    patterns:
      - pattern-either:
          # Static method call pattern — user_id from absint($_POST) → Class::method($uid, ...)
          # Covers: ClassName::helper($user_id, ...) with no ownership check in handler body.
          - patterns:
              - pattern: |
                  function $FUNC(...) {
                    ...
                    check_ajax_referer(...);
                    ...
                    $UID = <... absint(<... $_POST[...] ...>) ...>;
                    ...
                    $CLASS::$METHOD($UID, ...);
                    ...
                  }
              # Deep expression match: excludes handlers where current_user_can('edit_user', ...)
              # appears anywhere — as a bare call, inside if (!...), inside || conditions, etc.
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('edit_user', ...) ...>;
                    ...
                  }
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('edit_users') ...>;
                    ...
                  }
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('manage_options') ...>;
                    ...
                  }
          # Instance method call pattern — user_id from absint($_POST) → $obj->method($uid, ...)
          - patterns:
              - pattern: |
                  function $FUNC(...) {
                    ...
                    check_ajax_referer(...);
                    ...
                    $UID = <... absint(<... $_POST[...] ...>) ...>;
                    ...
                    $OBJ->$METHOD($UID, ...);
                    ...
                  }
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('edit_user', ...) ...>;
                    ...
                  }
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('edit_users') ...>;
                    ...
                  }
              - pattern-not: |
                  function $FUNC(...) {
                    ...
                    <... current_user_can('manage_options') ...>;
                    ...
                  }
