rules:
  - id: claude.php.wordpress.access-control.recovery-token-lookup-no-length-check-password-reset
    languages: [php]
    severity: CRITICAL
    message: |
      A password-recovery / account-verification handler reads a token
      identifier straight from the request (a decoded php://input JSON
      body, $_POST, $_REQUEST, or a REST request param), passes it verbatim
      as the sole %s placeholder of a $wpdb->prepare(...) call whose SQL
      string does a bare equality lookup ("... WHERE <col> = %s ...")
      against a custom database table, resolves a WP_User from a column of
      the fetched row via get_user_by(), and calls wp_set_password() on
      that user — with no minimum-length or fixed-format check performed on
      the token anywhere in the function before the lookup or the sink
      (CWE-269: Improper Privilege Management / CWE-640: Weak Password
      Recovery Mechanism).

      A custom, DB-table-backed recovery token is only as trustworthy as
      (a) the entropy of whatever generated it and (b) the length/format
      the handler itself demands before trusting a lookup match. When the
      handler performs no independent strlen()/format check on the
      submitted token, any weakness in the generator — a short alphabet, a
      predictable/time-seeded value, or a code path in the generator that
      can hand out the SAME token value for two different accounts (e.g. a
      "return the existing pending token" cache path keyed on IP/session
      rather than on the specific account being verified) — is sufficient
      to authorize a password change for an account other than the one the
      requester actually controls, including Administrator. Because the
      endpoint is typically an unauthenticated REST/AJAX "set new password"
      step of a forgot-password flow, this is exploitable pre-auth.

      This differs from WordPress core's own reset flow: core's
      check_password_reset_key() layers a fixed, high-entropy 20-character
      wp_generate_password() key (never client-influenceable) with its own
      expiry/hash validation — a plugin re-implementing recovery on a
      private table needs to reproduce that same length/format discipline
      itself, since the generic $wpdb equality lookup provides none of it.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - The token variable used in the $wpdb->prepare(...) WHERE clause is
          read directly from request data (json_decode(file_get_contents(
          "php://input")), $_POST, $_REQUEST, or a REST request param) with
          only cosmetic sanitization (e.g. sanitize_text_field()) — no
          length or format validation.
        - No strlen($TOKEN) / preg_match(..., $TOKEN) check on that same
          token variable appears anywhere in the function before the DB
          lookup or the wp_set_password() call.
        - The identity passed to wp_set_password()'s $user_id argument
          comes from get_user_by() resolving a column of the fetched row
          (e.g. $row->username / $row->user_login), not from a value the
          caller independently proved ownership of.

      FALSE POSITIVE indicators:
        - The function checks strlen($TOKEN) (or an equivalent minimum-
          length / fixed-format regex check) against the same token
          variable before the lookup or the sink executes.
        - The token is compared with hash_equals() against a stored value
          rather than matched purely via the SQL `=` lookup.
        - wp_set_password()'s user comes from get_current_user_id() or a
          value that does not originate from the fetched row.

      Fix: before trusting a custom recovery-token lookup, enforce a
      minimum length (matching the generator's actual output length) and/or
      expected format on the submitted token, in addition to the DB
      equality match — mirroring WP core's fixed, non-client-influenceable
      20-character reset-key length.
    metadata:
      category: security
      cwe: "CWE-269: Improper Privilege Management"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: CRITICAL
      subcategory: vuln
      vulnerability_class: "Privilege Escalation / Account Takeover"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/269.html
        - https://cwe.mitre.org/data/definitions/640.html
        - https://developer.wordpress.org/reference/functions/wp_set_password/
        - https://developer.wordpress.org/reference/functions/check_password_reset_key/
    patterns:
      - pattern-either:
          - pattern: |
              function $FUNC(...) {
                ...
                $TOKEN = <... $DATA[$KEY] ...>;
                ...
                $SQL = $WPDB->prepare($SQLSTR, $TOKEN, ...);
                ...
                $ROW = $WPDB->get_row($SQL);
                ...
                $USER = get_user_by($TYPE, $ROW->$PROP);
                ...
                wp_set_password($PASSWORD, $USER->ID);
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $TOKEN = <... $_POST[$KEY] ...>;
                ...
                $SQL = $WPDB->prepare($SQLSTR, $TOKEN, ...);
                ...
                $ROW = $WPDB->get_row($SQL);
                ...
                $USER = get_user_by($TYPE, $ROW->$PROP);
                ...
                wp_set_password($PASSWORD, $USER->ID);
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $TOKEN = <... $_REQUEST[$KEY] ...>;
                ...
                $SQL = $WPDB->prepare($SQLSTR, $TOKEN, ...);
                ...
                $ROW = $WPDB->get_row($SQL);
                ...
                $USER = get_user_by($TYPE, $ROW->$PROP);
                ...
                wp_set_password($PASSWORD, $USER->ID);
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $TOKEN = <... $REQUEST->get_param($KEY) ...>;
                ...
                $SQL = $WPDB->prepare($SQLSTR, $TOKEN, ...);
                ...
                $ROW = $WPDB->get_row($SQL);
                ...
                $USER = get_user_by($TYPE, $ROW->$PROP);
                ...
                wp_set_password($PASSWORD, $USER->ID);
                ...
              }
      - metavariable-regex:
          metavariable: $SQLSTR
          regex: (?i)^["'].*where.*=\s*%s.*$
      # FP guard — the CVE's actual fix: a minimum-length / fixed-format
      # check on the token gates the lookup/sink.
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... strlen($TOKEN) ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... preg_match(..., $TOKEN) ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... hash_equals($TOKEN, ...) ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... hash_equals(..., $TOKEN) ...>) { ... }
            ...
          }
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
