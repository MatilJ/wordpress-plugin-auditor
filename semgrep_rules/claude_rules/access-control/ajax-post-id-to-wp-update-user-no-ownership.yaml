rules:
  - id: claude.php.wordpress.access-control.ajax-post-id-to-wp-update-user-no-ownership
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      A user ID from an HTTP request parameter flows into wp_update_user() or
      wp_set_password() without a current_user_can('edit_user', $user_id) ownership
      check. Neither function performs internal authorization — the caller must verify
      ownership before invocation. A low-privilege user (Subscriber+) or unauthenticated
      visitor can change any user's email, password, or role, leading to full account
      takeover (CWE-639 IDOR).

      wp_update_user() accepts an array with 'ID' key — if ID originates from user
      input, any account can be targeted. wp_set_password() takes user_id as the second
      argument. wp_set_auth_cookie() takes user_id as the first argument — if attacker-
      controlled, it grants instant session hijack without password knowledge.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - Only nonce/Subscriber-level check before the call (check_ajax_referer(),
          is_user_logged_in(), current_user_can('read')).
        - No current_user_can('edit_user', $user_id) anywhere in the call chain.
        - user_id reaches wp_update_user/wp_set_password from POST/GET/REQUEST.

      FALSE POSITIVE indicators:
        - Handler has current_user_can('manage_options') or current_user_can('edit_users')
          — admin-only gate (PR:H, out of scope for bounty).
        - Handler verifies a cryptographic reset token via check_password_reset_key()
          before calling wp_set_password() — legitimate password reset flow.
        - The user_id is always get_current_user_id() in practice (the POST param is
          validated to match the current user before use).
        - wp_set_auth_cookie() called with return value of wp_signon() — legitimate
          login flow, not IDOR.

      Fix: verify ownership before writing:
        if ( ! current_user_can( 'edit_user', (int) $user_id ) ) {
            wp_send_json_error( 'Unauthorized', 403 );
        }

      Real-world CVEs: WCFM Membership (CVE-2023-2276, CVSS 9.8), WP Timetics
      (CVE-2024-9263), LearnDash (CVE-2023-3105), WooCommerce POS (CVE-2024-11281,
      CVSS 9.8), WP-Recall (unauthenticated password update).
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      likelihood: HIGH
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Insecure Direct Object Reference (IDOR)"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/wp_update_user/
        - https://developer.wordpress.org/reference/functions/wp_set_password/
        - https://developer.wordpress.org/reference/functions/current_user_can/
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: json_decode(file_get_contents("php://input"), ...)
          - pattern: file_get_contents("php://input")
    pattern-sanitizers:
      - pattern-either:
          # wp_signon() authenticates credentials and returns a verified WP_User —
          # the user ID in the return value is server-sourced, not attacker-controlled.
          - pattern: wp_signon(...)
          # Email/text sanitizers do not affect the ID value but carry taint from
          # non-ID POST fields into the wp_update_user array. Breaking taint here
          # prevents FPs where only a non-ID field (email, display_name) is tainted.
          - pattern: sanitize_email(...)
          - pattern: sanitize_text_field(...)
          - pattern: sanitize_textarea_field(...)
          - pattern: sanitize_user(...)
    pattern-sinks:
      - patterns:
          - pattern: wp_update_user($ARGS)
          - focus-metavariable: $ARGS
      - patterns:
          - pattern: wp_set_password($PASS, $USER_ID)
          - focus-metavariable: $USER_ID
      - patterns:
          - pattern: wp_set_auth_cookie($USER_ID, ...)
          - focus-metavariable: $USER_ID
