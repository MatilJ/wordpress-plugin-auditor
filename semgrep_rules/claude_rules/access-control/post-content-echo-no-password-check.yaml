rules:
  - id: claude.php.wordpress.access-control.post-content-echo-no-password-check
    languages: [php]
    severity: MEDIUM
    message: |
      A function echoes public head/meta markup (an Open Graph / Twitter Card /
      SEO description tag, JSON-LD block, or similar) that was built from the
      current post's excerpt or content — either a canonical WP getter
      (get_the_excerpt(), get_the_content(), $post->post_content,
      $post->post_excerpt) or a plugin-local helper whose name plainly reads as
      a description/excerpt getter (e.g. get_meta_description(),
      get_excerpt_by_id()) — with no post_password_required() check anywhere
      in the function (CWE-200).

      get_the_excerpt()/get_the_content() only apply the password-prompt
      substitution when invoked through the standard the_content/get_the_excerpt
      filter chain inside The Loop. A function that builds its own markup string
      from these calls (or a thin wrapper around them) and echoes it directly
      bypasses that substitution, so the real excerpt/content of a
      password-protected post is disclosed in page markup to any visitor who
      has not entered the post password, even though the rendered post body
      itself is correctly gated.

      Fix: check post_password_required() before generating any content-derived
      output, and skip/return before the markup is built:
        if ( post_password_required( get_the_ID() ) ) {
            return;
        }

      TRIAGE:
      TRUE POSITIVE indicators:
        - The function is hooked to a public-facing action (wp_head, a template
          output filter, a REST/AJAX callback reachable while logged out)
          rather than gated behind an admin screen.
        - No post_password_required() (or an equivalent explicit post_password
          check) exists anywhere earlier in the function or in its immediate
          caller.
      FALSE POSITIVE indicators:
        - The description/excerpt-named call is an unrelated getter (e.g. a
          product SKU "description" field), not post content/excerpt.
        - post_password_required() (or an explicit post_status/visibility
          check) already gates the function or its caller before this code
          runs.
        - The function only runs in an admin-only, cron, or CLI context and
          never renders the value to an unauthenticated visitor.

      SCOPE NOTE (Wordfence bounty policy): disclosure of non-public post/page/
      CPT content is CVE-only / bounty-ineligible under current policy
      regardless of auth floor or install count. Record this as an
      architectural lead, not a submittable finding, unless the same gap
      discloses user/customer PII rather than post/CPT content.
    metadata:
      category: security
      cwe: "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      likelihood: MEDIUM
      impact: LOW
      subcategory: vuln
      vulnerability_class: "Information Disclosure"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://developer.wordpress.org/reference/functions/post_password_required/
        - https://developer.wordpress.org/reference/functions/get_the_excerpt/
    paths:
      exclude:
        - "**/freemius/**"
        - "**/vendor/**"
        - "**/admin/**"
    patterns:
      - pattern-either:
          # Canonical WP getters echoed inline (direct or via string concat into
          # a variable that is echoed later in the same function).
          - patterns:
              - pattern-either:
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        echo <... get_the_excerpt(...) ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        echo <... get_the_content(...) ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        echo <... $POST->post_content ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        echo <... $POST->post_excerpt ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        $TAG .= <... get_the_excerpt(...) ...>;
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        $TAG .= <... get_the_content(...) ...>;
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
          # Plugin-local wrapper named like a description/excerpt getter, whose
          # result is folded into a variable that is echoed later — bare or
          # wrapped in a conditional (the common "if ( $this->get_x() ) { $tag
          # .= ... $this->get_x() ... }" shape used by SEO/social meta builders).
          - patterns:
              - pattern-either:
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        $TAG .= <... $OBJ->$GETTER(...) ...>;
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        $TAG .= <... $GETTER(...) ...>;
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        if (...) {
                          ...
                          $TAG .= <... $OBJ->$GETTER(...) ...>;
                          ...
                        }
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
                  - pattern: |
                      function $FUNC(...) {
                        ...
                        if (...) {
                          ...
                          $TAG .= <... $GETTER(...) ...>;
                          ...
                        }
                        ...
                        echo <... $TAG ...>;
                        ...
                      }
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: (?i).*(excerpt|description).*
              # Require the same function to also assemble genuine public head/
              # social markup (an og:/twitter: meta property, JSON-LD, or a
              # <meta> tag) — filters out unrelated "description" getters such
              # as a WP Settings API field-help-text builder, which builds
              # <input>/<span> markup, never a meta/og/twitter/ld+json literal.
              - pattern-inside: |
                  function $FUNC(...) {
                    ...
                    <... "$MARKUP_LIT" ...>;
                    ...
                  }
              - metavariable-regex:
                  metavariable: $MARKUP_LIT
                  regex: (?is).*(<meta\b|\bog:|\btwitter:|ld\+json).*
      # Exclude: post_password_required() present as a standalone statement.
      - pattern-not: |
          function $FUNC(...) {
            ...
            post_password_required(...);
            ...
          }
      # Exclude: post_password_required() used inside an if-condition (the
      # common real-world fix shape: `if ( post_password_required(...) ) { return; }`).
      - pattern-not: |
          function $FUNC(...) {
            ...
            if (<... post_password_required(...) ...>) {
              ...
            }
            ...
          }
