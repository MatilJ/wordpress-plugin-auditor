rules:
  - id: claude.php.wordpress.access-control.optional-auth-flag-skips-password-check
    languages: [php]
    severity: CRITICAL
    message: |
      A custom login/authentication function accepts a boolean parameter (its
      name suggests require/verify/check + auth/password/login) that DEFAULTS
      TO true and gates whether the real credential check (wp_authenticate()/
      wp_check_password()/wp_signon()/wp_authenticate_application_password())
      is invoked at all. The function also looks up the account by
      get_user_by() (email or login), independent of that gate. When a caller
      passes the flag as false — e.g. because a related form/config field
      ("is a password required for this login method?") is unset, absent for
      legacy stored data, or otherwise influenced by something other than a
      hardcoded, trusted constant — the credential-verification branch never
      runs, and the function falls through to returning the WP_User object it
      already fetched via the bare identifier lookup, i.e. it treats "an
      account with this email/username exists" as "the caller is that user"
      (CWE-269 / CWE-287).

      An unauthenticated attacker who can reach any caller that passes the
      flag as false can be treated as ANY existing account (including
      administrators) by supplying only that account's email/username — no
      password required. This is the root cause of a real Wordfence-disclosed
      unauthenticated privilege-escalation vulnerability in a booking-form
      login handler that made password verification conditional on a
      per-form "require password" setting, with no independent default-deny
      path when that setting was false or absent.

      Fix: never make the credential-verification call itself conditional.
      Always invoke wp_authenticate()/wp_check_password()/wp_signon() — using
      an empty string if no password was submitted — so that a missing or
      optional password fails verification instead of skipping it.

      TRIAGE:
      TRUE POSITIVE indicators:
        - The gating flag's value traces back to something other than a
          hardcoded `true`/`false` literal at the call site — a stored
          form/field configuration, option, or request value.
        - No unconditional call to the same credential-check function exists
          elsewhere in the function to cover the flag-false case.
        - The function's return value (the WP_User) is later used by any
          caller to establish a session (wp_set_auth_cookie(), wp_signon(),
          wp_set_current_user()).
      FALSE POSITIVE indicators:
        - Every call site passes a hardcoded, trusted boolean literal for the
          flag (verification is never actually skippable in practice).
        - A different, unconditional credential check already executes
          earlier in the same function and its failure short-circuits
          (return/throw) before the gated block is reached.
        - The flag only gates a non-authentication side effect (e.g. a
          "remember me" cookie duration, a log message) rather than the
          credential check itself.
    metadata:
      category: security
      cwe:
        - "CWE-269: Improper Privilege Management"
        - "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/269.html
        - https://cwe.mitre.org/data/definitions/287.html
        - https://developer.wordpress.org/reference/functions/wp_authenticate/
        - https://developer.wordpress.org/reference/functions/get_user_by/
    patterns:
      - pattern-inside: |
          function $FUNC(..., $FLAG = true, ...) {
            ...
          }
      - pattern-inside: |
          function $FUNC(...) {
            ...
            <... get_user_by(...) ...>;
            ...
          }
      - pattern-either:
          - pattern: |
              if ($FLAG) {
                ...
                $USER = $SINK(...);
                ...
              }
          - pattern: |
              if ($FLAG) {
                ...
                $SINK(...);
                ...
              }
      - metavariable-regex:
          metavariable: $FLAG
          regex: (?i)^\$(require|verify|check|need|should|force|skip|do)_?(auth|password|creden|login)
      - metavariable-regex:
          metavariable: $SINK
          regex: ^(wp_authenticate|wp_check_password|wp_signon|wp_authenticate_application_password)$
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
