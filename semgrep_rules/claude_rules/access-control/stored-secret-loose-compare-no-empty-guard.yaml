rules:
  - id: claude.php.wordpress.access-control.stored-secret-loose-compare-no-empty-guard
    languages: [php]
    severity: HIGH
    message: |
      A verification-code/one-time-secret check reads the "expected" value
      from server-side persistent storage (get_user_meta()/get_transient()/
      get_option()/get_post_meta()/get_site_option()/get_comment_meta()) and
      compares it, with loose equality (== or !=), against a value captured
      from request input — but nowhere in the same function is either operand
      checked for emptiness before the comparison. The branch reached when the
      values match completes login (wp_set_auth_cookie()/wp_set_current_user()/
      wp_signon()) (CWE-287: Improper Authentication / CWE-697: Incorrect
      Comparison).

      Persistent-storage getters return an empty string/false when the given
      key was never set (e.g. no code has been generated yet for this
      identifier, or it already expired/was consumed). PHP's loose equality
      treats an empty stored value and an empty/omitted submitted value as
      equal ('' != '' is false, and null == '' is true). If the caller can
      reach the verification step without ever having triggered code
      generation for the target account, or can simply omit the submitted
      field, the "expected vs submitted" comparison silently passes with no
      real secret ever known or guessed — an authentication bypass for any
      account the caller can name.

      Fix: reject the request immediately (before the comparison) whenever
      either the stored value or the submitted value is empty, and prefer
      hash_equals() over a loose operator for the actual comparison.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - The stored value is fetched via a persistent-storage getter keyed on
          an identifier the same request can influence (e.g. a user id
          resolved moments earlier from a request-supplied email/username).
        - No empty()/isset() guard on the stored value or the submitted value
          appears anywhere else in the function before the comparison runs.
        - The match/mismatch branch directly reaches a login-completing sink,
          not just a display or logging decision.

      FALSE POSITIVE indicators:
        - The function contains an empty() (or equivalent isset()-negation)
          check on the stored value, the submitted value, or both, anywhere
          before the sink is reached — even if unconditional early-return is
          the only effect.
        - The comparison uses hash_equals() rather than == or != for the
          actual match test.
        - The submitted value can never be empty by construction (e.g. it is
          validated against a fixed-length format elsewhere in the same
          function before this point).
    metadata:
      category: security
      cwe:
        - "CWE-287: Improper Authentication"
        - "CWE-697: Incorrect Comparison"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://cwe.mitre.org/data/definitions/697.html
        - https://developer.wordpress.org/reference/functions/hash_equals/
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
    patterns:
      - pattern-either:
          # Branch 1: submitted value captured first, stored secret fetched
          # second (the literal shape of the seeding disclosure — a request
          # parameter read near the top of the handler, the persisted secret
          # looked up later at the actual verification step).
          - pattern: |
              function $FUNC(...) {
                ...
                $SUBMITTED = $REQSRC;
                ...
                $SAVED = $STORAGE(...);
                ...
                if ($SAVED != $SUBMITTED) {
                  ...
                  return ...;
                }
                ...
                <... $SINK(...) ...>;
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $SUBMITTED = $REQSRC;
                ...
                $SAVED = $STORAGE(...);
                ...
                if ($SUBMITTED != $SAVED) {
                  ...
                  return ...;
                }
                ...
                <... $SINK(...) ...>;
                ...
              }
          # Branch 2: stored secret fetched first, submitted value captured
          # second — the reverse assignment order.
          - pattern: |
              function $FUNC(...) {
                ...
                $SAVED = $STORAGE(...);
                ...
                $SUBMITTED = $REQSRC;
                ...
                if ($SAVED != $SUBMITTED) {
                  ...
                  return ...;
                }
                ...
                <... $SINK(...) ...>;
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $SAVED = $STORAGE(...);
                ...
                $SUBMITTED = $REQSRC;
                ...
                if ($SUBMITTED != $SAVED) {
                  ...
                  return ...;
                }
                ...
                <... $SINK(...) ...>;
                ...
              }
      - metavariable-pattern:
          metavariable: $REQSRC
          patterns:
            - pattern-either:
                - pattern: $_GET[...]
                - pattern: $_POST[...]
                - pattern: $_REQUEST[...]
                - pattern: $_COOKIE[...]
                - pattern: $X->get_param(...)
                - pattern: $X->get_parameter(...)
                - pattern: sanitize_text_field($_GET[...])
                - pattern: sanitize_text_field($_POST[...])
                - pattern: sanitize_text_field($_REQUEST[...])
                - pattern: sanitize_key($_GET[...])
                - pattern: sanitize_key($_POST[...])
                - pattern: sanitize_key($_REQUEST[...])
                - pattern: trim($_GET[...])
                - pattern: trim($_POST[...])
                - pattern: trim($_REQUEST[...])
      - metavariable-regex:
          metavariable: $STORAGE
          regex: "^(get_user_meta|get_transient|get_option|get_post_meta|get_site_option|get_comment_meta)$"
      - metavariable-regex:
          metavariable: $SINK
          regex: "^(wp_set_auth_cookie|wp_set_current_user|wp_signon)$"
      # FP guard — the real fix shape: an empty() check on the stored value
      # anywhere in the same function before the comparison is trusted.
      - pattern-not: |
          function $FUNC(...) {
            ...
            if (<... empty($SAVED) ...>) {
              ...
            }
            ...
          }
      # FP guard — an empty() check on the submitted value anywhere in the
      # same function before the comparison is trusted.
      - pattern-not: |
          function $FUNC(...) {
            ...
            if (<... empty($SUBMITTED) ...>) {
              ...
            }
            ...
          }
