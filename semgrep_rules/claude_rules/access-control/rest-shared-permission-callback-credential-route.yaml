rules:
  - id: claude.php.wordpress.access-control.rest-shared-permission-callback-credential-route
    languages: [php]
    severity: HIGH
    message: |
      A REST API route whose callback persists a token/secret/credential value
      (update_option() with a token/secret/key-named option, or an equivalent
      credential-setting operation) is registered with the exact same
      permission_callback string as another, unrelated route in the same file
      (CWE-266 / CWE-862). Generic permission callbacks of this shape typically
      authenticate by comparing request input against the CURRENT stored value
      of the very credential being protected (see the empty-secret-comparison
      family of bugs): the option defaults to empty on a fresh/unconfigured
      install, so an unauthenticated caller who submits a matching (often
      empty) value can pass the gate.

      Reusing that one generic gate for the credential's own
      registration/bootstrap route collapses the trust boundary between "the
      secret has never been configured" and "the caller already possesses the
      secret" — the very route meant to establish the credential is guarded by
      a check of whether the caller already knows it. This is the deputy
      pattern behind CWE-266 unauthenticated privilege-escalation reports where
      a plugin's token-registration endpoint reuses its regular API-token
      permission check instead of an explicit administrator-only gate.

      Fix: give the credential-setting route its own dedicated
      permission_callback that does not depend on the credential's current
      value — e.g. current_user_can('manage_options') or a nonce tied to an
      authenticated admin action — instead of reusing the same generic
      token-comparison function used by the routes it is meant to protect.
    metadata:
      category: security
      cwe: "CWE-266: Incorrect Privilege Assignment"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Privilege Escalation"
      technology: [php, wordpress]
      # TRIAGE GUIDANCE:
      # TRUE POSITIVE: one of the two routes sharing $PERMCB is the endpoint
      # that WRITES the plugin's shared secret (update_option with a
      # token/secret/api_key/credential-named option), and permission_callback
      # is a bare function reference (not an inline current_user_can() check).
      # Confirm the referenced permission function validates by comparing
      # input against get_option() of that same secret (empty-by-default
      # bypass) rather than an explicit capability/role check.
      # FALSE POSITIVE: the shared callback performs a real capability check
      # (e.g. delegates to current_user_can()) rather than a stored-secret
      # comparison — the reuse is then benign (a single admin-only gate
      # protecting several admin routes, one of which happens to touch a
      # credential option). Read the permission_callback function body to
      # confirm before reporting.
      references:
        - https://developer.wordpress.org/rest-api/extending-the-rest-api/adding-custom-endpoints/#permissions-callback
        - https://cwe.mitre.org/data/definitions/266.html
        - https://cwe.mitre.org/data/definitions/862.html
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  register_rest_route($NS1, $PATH1, array(..., 'callback' => $CB1, ..., 'permission_callback' => $PERMCB, ...));
                  ...
                  register_rest_route($NS2, $PATH2, array(..., 'callback' => $CB2, ..., 'permission_callback' => $PERMCB, ...));
              - metavariable-regex:
                  metavariable: $CB1
                  regex: (?i).*(token|secret|api.?key|credential|passw).*
          - patterns:
              - pattern: |
                  register_rest_route($NS1, $PATH1, array(..., 'callback' => $CB1, ..., 'permission_callback' => $PERMCB, ...));
                  ...
                  register_rest_route($NS2, $PATH2, array(..., 'callback' => $CB2, ..., 'permission_callback' => $PERMCB, ...));
              - metavariable-regex:
                  metavariable: $CB2
                  regex: (?i).*(token|secret|api.?key|credential|passw).*
          - patterns:
              - pattern: |
                  register_rest_route($NS1, $PATH1, [..., 'callback' => $CB1, ..., 'permission_callback' => $PERMCB, ...]);
                  ...
                  register_rest_route($NS2, $PATH2, [..., 'callback' => $CB2, ..., 'permission_callback' => $PERMCB, ...]);
              - metavariable-regex:
                  metavariable: $CB1
                  regex: (?i).*(token|secret|api.?key|credential|passw).*
          - patterns:
              - pattern: |
                  register_rest_route($NS1, $PATH1, [..., 'callback' => $CB1, ..., 'permission_callback' => $PERMCB, ...]);
                  ...
                  register_rest_route($NS2, $PATH2, [..., 'callback' => $CB2, ..., 'permission_callback' => $PERMCB, ...]);
              - metavariable-regex:
                  metavariable: $CB2
                  regex: (?i).*(token|secret|api.?key|credential|passw).*
