rules:
  - id: claude.php.wordpress.access-control.password-reset-recipient-no-email-ownership-check
    languages: [php]
    severity: CRITICAL
    message: |
      A password-reset / account-recovery handler resolves a WP_User from a
      request-controlled identifier (username/login/ID/slug) via
      get_user_by(), generates a genuine reset key/token for that resolved
      user via get_password_reset_key(), and emails the key/link via
      wp_mail()/mail() to a recipient address that is itself an independent,
      request-controlled value — with no check anywhere in the function that
      the submitted recipient actually equals the resolved user's own stored
      user_email (CWE-640: Weak Password Recovery Mechanism / CWE-269:
      Improper Privilege Management).

      Because the TARGET account (chosen via username/login/ID) and the
      RECIPIENT mailbox (chosen via a separate email field) are accepted as
      two independent, unauthenticated request parameters with no cross-check
      binding them together, an attacker can request a password reset for ANY
      known username while supplying their OWN address as the recipient. The
      site's own mailer then delivers a completely genuine, valid reset
      key/link for the victim account to the attacker's inbox — full account
      takeover, including of Administrator accounts, requiring no
      authentication and no victim interaction.

      This differs from WordPress core's built-in retrieve_password(), which
      always emails the resolved user's OWN stored user_email — the request
      never supplies (or is allowed to influence) the recipient address
      independently of the resolved account.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - The recipient argument to wp_mail()/mail() is a variable that is
          independent of — and never checked against — the WP_User object
          resolved by get_user_by() earlier in the same function.
        - get_user_by() is called with a request-controlled 'login', 'id', or
          'slug' identifier (not 'email'), and get_password_reset_key() (or
          an equivalent reset-token generator) is invoked on that resolved
          user before the mail is sent.

      FALSE POSITIVE indicators:
        - The function compares the submitted recipient to the resolved
          user's real address (e.g. $user->user_email /
          $user->get('user_email')) and returns/aborts before sending when
          they differ, or reassigns the recipient variable to the resolved
          user's own address before the wp_mail()/mail() call.
        - The recipient argument passed to wp_mail()/mail() is itself the
          resolved user's own property/getter (e.g. $user->user_email,
          $user->get('user_email')) rather than the original request value.
        - The email is sent to a fixed, server-controlled address
          (get_option('admin_email') or similar) rather than a
          request-controlled one.

      Fix: never trust a client-supplied recipient address for a
      password-reset email. Always send to the resolved user's own
      user_email, or explicitly verify submitted_email === $user->user_email
      (/ $user->get('user_email')) before sending — mirroring WP core's
      retrieve_password().
    metadata:
      category: security
      cwe:
        - "CWE-640: Weak Password Recovery Mechanism for Forgotten Password"
        - "CWE-269: Improper Privilege Management"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
      likelihood: HIGH
      impact: CRITICAL
      subcategory: vuln
      vulnerability_class: "Privilege Escalation / Account Takeover"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/640.html
        - https://cwe.mitre.org/data/definitions/269.html
        - https://developer.wordpress.org/reference/functions/get_password_reset_key/
        - https://developer.wordpress.org/reference/functions/retrieve_password/
    patterns:
      - pattern-either:
          - pattern: |
              function $FUNC(...) {
                ...
                $USER = get_user_by($TYPE, $UNAME);
                ...
                $KEY = get_password_reset_key($USER);
                ...
                wp_mail($EMAIL, ...);
                ...
              }
          - pattern: |
              function $FUNC(...) {
                ...
                $USER = get_user_by($TYPE, $UNAME);
                ...
                $KEY = get_password_reset_key($USER);
                ...
                mail($EMAIL, ...);
                ...
              }
      - metavariable-regex:
          metavariable: $TYPE
          regex: "^['\"](login|id|slug)['\"]$"
      # FP guard #1 — the exact shape of this CVE's official fix: an explicit
      # not-equal comparison between the recipient variable and the resolved
      # user's real email, gating the send.
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... $EMAIL !== $USER_EMAIL ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... $USER_EMAIL !== $EMAIL ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... $EMAIL != $USER_EMAIL ...>) { ... }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... $USER_EMAIL != $EMAIL ...>) { ... }
            ...
          }
      # FP guard #2 — the WP-core-style fix: the recipient argument IS the
      # resolved user's own stored address, referenced directly at the sink.
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_mail($USER->user_email, ...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_mail($USER->get("user_email"), ...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_mail($USER->get('user_email'), ...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            mail($USER->user_email, ...);
            ...
          }
      # FP guard #3 — the recipient is a fixed, server-controlled address, not
      # request-controlled.
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_mail(get_option(...), ...);
            ...
          }
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
