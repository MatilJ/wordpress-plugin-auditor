rules:
  - id: claude.php.wordpress.access-control.ajax-post-id-to-wp-delete-post-no-ownership
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      A resource ID from an HTTP request parameter flows into a WordPress
      content deletion function without a per-resource capability check. None
      of these functions perform internal authorization — the caller must
      verify the appropriate current_user_can() before invocation (CWE-639).

      Covered sinks:
        - wp_delete_post/wp_trash_post/wp_delete_attachment: require
          current_user_can('delete_post', $id)
        - wp_delete_comment/wp_trash_comment: require
          current_user_can('moderate_comments') or ownership verification
        - wp_delete_term: requires current_user_can('delete_term', $id)
        - wp_delete_user: requires current_user_can('delete_users') — cascades
          to delete all user posts, media, comments, and links

      wp_delete_attachment($id, true) permanently removes both the database
      record AND the physical file — irreversible data loss.
      wp_delete_user($id) cascades to delete all user content — highest impact.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - Only nonce/class-level capability checked before the call.
        - No per-resource current_user_can() anywhere in the call chain.
        - Resource ID reaches deletion function from POST/GET/REQUEST.

      FALSE POSITIVE indicators:
        - Handler has current_user_can('manage_options') — admin-only gate (PR:H).
        - Handler calls current_user_can('delete_post', $id) with the same
          tainted ID before the deletion.
        - The ID is sourced from a DB query (taint broken).
        - The function is inside an admin-only page (check admin menu registration).
        - Inside register_uninstall_hook/register_deactivation_hook (cleanup).
        - wp_delete_user($id) call is itself wrapped in
          `if ( $id === get_current_user_id() || current_user_can(...) )` —
          this rule's negative clause already recognizes that idiom (self-account
          deletion or a broad capability grant) as fixed and will not flag it;
          if you see it flagged anyway, the guard uses a different ID expression
          than the one passed to wp_delete_user() and deserves a closer look.

      Fix: verify ownership before deleting:
        if ( ! current_user_can( 'delete_post', (int) $post_id ) ) {
            wp_send_json_error( 'Unauthorized', 403 );
        }
      For wp_delete_user($id) specifically, allow self-service deletion or a
      broad capability, but nothing else:
        if ( (int) $id === get_current_user_id() || current_user_can( 'edit_users' ) ) {
            wp_delete_user( (int) $id );
        }
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      likelihood: HIGH
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Insecure Direct Object Reference (IDOR)"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/wp_delete_post/
        - https://developer.wordpress.org/reference/functions/wp_delete_attachment/
        - https://developer.wordpress.org/reference/functions/wp_delete_comment/
        - https://developer.wordpress.org/reference/functions/wp_delete_term/
        - https://developer.wordpress.org/reference/functions/wp_delete_user/
        - https://developer.wordpress.org/reference/functions/current_user_can/
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: json_decode(file_get_contents("php://input"), ...)
          - pattern: file_get_contents("php://input")
    pattern-sanitizers:
      - pattern-either:
          - pattern: $wpdb->get_results(...)
          - pattern: $wpdb->get_row(...)
          - pattern: $wpdb->get_var(...)
          - pattern: $wpdb->get_col(...)
          - pattern: get_option(...)
    pattern-sinks:
      - patterns:
          - pattern: wp_delete_post($ID, ...)
          - focus-metavariable: $ID
          # Early-return ownership guard on the same ID, earlier in the same
          # function/method — the documented FALSE POSITIVE indicator "Handler
          # calls current_user_can('delete_post', $id) with the same tainted
          # ID before the deletion", made mechanical for the negative
          # early-return phrasing (if (!current_user_can(...)) { return; }).
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (! current_user_can('delete_post', $ID)) {
                  ...
                }
                ...
              }
      - patterns:
          - pattern: wp_trash_post($ID)
          - focus-metavariable: $ID
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (! current_user_can('delete_post', $ID)) {
                  ...
                }
                ...
              }
      - patterns:
          - pattern: wp_delete_attachment($ID, ...)
          - focus-metavariable: $ID
          # Confirmed FP source: admin-site-enhancements 8.9.1
          # class-media-replacement.php replace_media() — this exact guard
          # precedes the wp_delete_attachment() call by ~75 lines in the same
          # method.
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (! current_user_can('delete_post', $ID)) {
                  ...
                }
                ...
              }
      - patterns:
          - pattern: wp_delete_comment($ID, ...)
          - focus-metavariable: $ID
      - patterns:
          - pattern: wp_trash_comment($ID)
          - focus-metavariable: $ID
      - patterns:
          - pattern: wp_delete_term($ID, ...)
          - focus-metavariable: $ID
      - patterns:
          - pattern: wp_delete_user($ID, ...)
          - focus-metavariable: $ID
          # Self-or-broad-capability ownership guard around the deletion itself —
          # the ID reaching wp_delete_user() either has to equal the requester's
          # own ID or the requester must hold a broad user-management capability.
          # Matches both operand orders for the equality check and for the ||.
          - pattern-not-inside: |
              if ($ID === get_current_user_id() || current_user_can(...)) {
                ...
              }
          - pattern-not-inside: |
              if (get_current_user_id() === $ID || current_user_can(...)) {
                ...
              }
          - pattern-not-inside: |
              if (current_user_can(...) || $ID === get_current_user_id()) {
                ...
              }
          - pattern-not-inside: |
              if (current_user_can(...) || get_current_user_id() === $ID) {
                ...
              }
