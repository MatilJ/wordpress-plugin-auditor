rules:
  - id: claude.php.wordpress.access-control.ajax-post-id-to-post-meta-write-no-ownership
    mode: taint
    languages: [php]
    severity: MEDIUM
    message: |
      A post ID from an HTTP request parameter flows into update_post_meta(),
      delete_post_meta(), or add_post_meta() without a per-resource capability check.
      None of these functions perform internal authorization — the caller must verify
      current_user_can('edit_post', $post_id) before invocation (CWE-862 Missing
      Authorization / IDOR).

      A common mistake: the handler checks current_user_can('edit_posts') (plural,
      no ID) which is a class-level gate — it verifies the user CAN edit posts in
      general, but does NOT authorize editing a SPECIFIC post owned by another user.

      TRIAGE GUIDANCE:

      TRUE POSITIVE indicators:
        - Only nonce/class-level capability checked before the meta write.
        - No current_user_can('edit_post', $post_id) with the specific post ID.
        - post_id reaches meta function from POST/GET/REQUEST/REST params.

      FALSE POSITIVE indicators:
        - Handler has current_user_can('manage_options') — admin-only gate (PR:H).
        - Handler calls current_user_can('edit_post', $post_id) with the tainted ID.
        - The post ID comes from a DB query (taint broken by server-sourced read).
        - The meta key is plugin-internal settings with no security-sensitive data.

      Impact depends on what metadata is written:
        - _wp_attached_file / _thumbnail_id → file path manipulation
        - Pricing/inventory fields → financial fraud
        - Plugin settings → configuration manipulation
        - Arbitrary meta key from user input → privilege escalation via wp_capabilities

      Fix: verify ownership before writing:
        if ( ! current_user_can( 'edit_post', (int) $post_id ) ) {
            wp_send_json_error( 'Unauthorized', 403 );
        }

      Real-world CVEs: ACF to REST API (CVE-2025-12030), TaxoPress (CVE-2025-14371),
      GetGenie (CVE-2026-2879).
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      likelihood: HIGH
      impact: MEDIUM
      subcategory: audit
      vulnerability_class: "Insecure Direct Object Reference (IDOR)"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/update_post_meta/
        - https://developer.wordpress.org/reference/functions/current_user_can/
        - https://owasp.org/www-project-top-ten/2021/A01_2021-Broken_Access_Control
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: json_decode(file_get_contents("php://input"), ...)
          - pattern: file_get_contents("php://input")
    pattern-sanitizers:
      - pattern-either:
          - pattern: $wpdb->get_results(...)
          - pattern: $wpdb->get_row(...)
          - pattern: $wpdb->get_var(...)
          - pattern: $wpdb->get_col(...)
          - pattern: get_option(...)
          - pattern: get_user_meta(...)
    pattern-sinks:
      - patterns:
          - pattern: update_post_meta($POST_ID, ...)
          - focus-metavariable: $POST_ID
          # Exclude admin-only gates (manage_options) — the handler's true required
          # capability already exceeds per-resource edit_post ownership, PR:H → OOS.
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (<... current_user_can('manage_options') ...>) { ... }
                ...
              }
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                current_user_can('manage_options');
                ...
              }
      - patterns:
          - pattern: delete_post_meta($POST_ID, ...)
          - focus-metavariable: $POST_ID
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (<... current_user_can('manage_options') ...>) { ... }
                ...
              }
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                current_user_can('manage_options');
                ...
              }
      - patterns:
          - pattern: add_post_meta($POST_ID, ...)
          - focus-metavariable: $POST_ID
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                if (<... current_user_can('manage_options') ...>) { ... }
                ...
              }
          - pattern-not-inside: |
              function $FUNC(...) {
                ...
                current_user_can('manage_options');
                ...
              }
