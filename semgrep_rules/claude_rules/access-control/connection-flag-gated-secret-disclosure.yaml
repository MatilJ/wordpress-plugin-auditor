rules:
  - id: claude.php.wordpress.access-control.connection-flag-gated-secret-disclosure
    languages: [php]
    severity: HIGH
    message: |
      A ternary expression discloses a secret-like value (auth key, API key,
      access/auth token, license key, pairing code) in its "not yet connected"
      branch, gated by nothing more than a single boolean state-check
      method/function call (is linked / paired / connected / configured /
      activated / registered). Before that connection or pairing is
      established, ANY requester who can reach the surrounding response (a
      status/handshake/ping endpoint commonly fired unauthenticated on
      init/admin_init, or an AJAX/REST callback) receives the live secret in
      plaintext and can replay it to complete the pairing/registration flow
      itself, gaining whatever elevated remote-management capability the
      pairing grants — an unauthenticated privilege escalation (CWE-266).

      Verify: (1) the state-check truly gates nothing but this ternary (no
      capability/nonce check also wraps it — see pattern-not-inside below);
      (2) the surrounding function/response is reachable pre-authentication;
      (3) the disclosed value is later accepted as a credential elsewhere in
      the plugin (e.g. compared with == / === / hash_equals() to authorize a
      connect/pair/register action).

      Fix: never place a live secret behind a single "not yet configured"
      boolean. Require a fresh, explicitly-opened, time-boxed pairing window
      combined with an origin check (IP allow-list) or hash_equals() against
      a value the requester must already possess before returning it.
    metadata:
      category: security
      cwe: "CWE-266: Incorrect Privilege Assignment"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Privilege Escalation"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/266.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    paths:
      exclude:
        - "**/vendor/**"
        - "**/freemius/**"
        - "**/node_modules/**"
    patterns:
      - pattern-either:
          - pattern: "$COND ? $EMPTY : $SECRET"
          - pattern: "!$COND ? $SECRET : $EMPTY"
      # Condition must be a single state-check call, not a boolean composite —
      # the real fix OR/AND-ed in an extra time-window/IP-allowlist check, so
      # a patched composite condition no longer matches this exact shape.
      - pattern-not: "$A || $B ? $EMPTY : $SECRET"
      - pattern-not: "$A && $B ? $EMPTY : $SECRET"
      - pattern-not: "!($A || $B) ? $SECRET : $EMPTY"
      - pattern-not: "!($A && $B) ? $SECRET : $EMPTY"
      - metavariable-regex:
          metavariable: $COND
          regex: "(?i).*(linked|paired|connect|configur|activat|regist|bound|setup|authoriz|handshake).*"
      - metavariable-regex:
          metavariable: $EMPTY
          regex: "^(''|\"\")$"
      - metavariable-regex:
          metavariable: $SECRET
          regex: "(?i).*(auth_?key|api_?key|secret|license_?key|pairing_?key|pairing_?code|access_?token|auth_?token|secret_?key).*"
      # Exclude: a genuine capability/nonce gate already wraps the whole
      # disclosure — the single state-flag ternary is then redundant, not
      # the sole gate.
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            current_user_can(...);
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            if (<... current_user_can(...) ...>) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            wp_verify_nonce(...);
            ...
          }
