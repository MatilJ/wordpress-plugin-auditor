rules:
  - id: claude.php.wordpress.access-control.empty-secret-comparison-auth-bypass
    languages: [php]
    severity: HIGH
    message: |
      A secret retrieved via get_option() is compared to user input without first
      checking whether the secret is empty. When the option has never been set
      (e.g., plugin installed but not fully configured), get_option() returns an
      empty string by default. If the attacker sends an empty value for the
      corresponding input parameter, the comparison succeeds: "" == "" or
      "" === "" both evaluate to true, bypassing authentication entirely.

      CVE-2025-3102 (OttoKit/SureTriggers): the plugin's REST API checked
      $secret_key === $header_value, but never verified that $secret_key was
      non-empty. Sending an empty Authorization header bypassed auth on
      unconfigured installations. CVE-2024-10781 (CleanTalk): same pattern.

      Fix: always check empty($secret) or $secret === false before comparing.
      Return an authentication failure immediately if the stored secret is absent.

      Variant (fail-closed guard clause): the expected value is a hardcoded
      empty-string literal in source, assigned in one branch intended for an
      internal-only invocation path, rather than a runtime lookup that merely
      happens to be empty. A mismatch-returns guard clause (e.g.
      "if ($expected !== $input) { return; }") compares it against
      externally-influenced data. Because the request-derived operand also
      defaults to an empty string when its corresponding parameter is simply
      omitted, the check is a tautology on every installation, not only
      unconfigured ones — there is no secret to guess. TRIAGE: confirm the
      branch that assigns the empty literal is reachable from the same function
      via an externally-triggerable code path (e.g. a public hook that re-reads
      request superglobals), not exclusively from a trusted internal call site.

      Variant (array-keyed option): the secret is not its own top-level option
      but one key inside a larger settings array returned by a single
      get_option() call, e.g. a subscript expression such as
      "get_option(the_option_name)[the_secret_key]", compared inline with no
      preceding emptiness check on that array element. Same root cause as
      Scenario 1 — an unconfigured install leaves the key absent or empty —
      but a bare "secret variable assigned straight from get_option()" shape
      does not match this subscript form, so it needs its own clause.
    metadata:
      category: security
      cwe:
        - "CWE-1390: Weak Authentication"
        - "CWE-287: Improper Authentication"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "Authentication Bypass"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/functions/get_option/
        - https://www.wordfence.com/blog/2025/04/100000-wordpress-sites-affected-by-administrative-user-creation-vulnerability-in-suretriggers-wordpress-plugin/
        - https://www.wordfence.com/threat-intel/vulnerabilities/wordpress-plugins/developer-flavor/security-anti-spam-by-cleantalk-6451-authorization-bypass-via-reverse-dns-spoofing-to-unauthenticated-arbitrary-plugin-installation
    patterns:
      - pattern-either:
          # Scenario 1: secret read from storage, never configured -> empty by default.
          - patterns:
              - pattern-either:
                  # == comparison: secret on left
                  - pattern: |
                      $SECRET = get_option($KEY);
                      ...
                      if ($SECRET == $INPUT) { ... }
                  # == comparison: secret on right
                  - pattern: |
                      $SECRET = get_option($KEY);
                      ...
                      if ($INPUT == $SECRET) { ... }
                  # === comparison: secret on left
                  - pattern: |
                      $SECRET = get_option($KEY);
                      ...
                      if ($SECRET === $INPUT) { ... }
                  # === comparison: secret on right
                  - pattern: |
                      $SECRET = get_option($KEY);
                      ...
                      if ($INPUT === $SECRET) { ... }
              - metavariable-regex:
                  metavariable: $KEY
                  regex: .*(?:secret|key|token|api_key|license|auth|password|salt|signing).*
              - pattern-not: |
                  $SECRET = get_option($KEY);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($SECRET == $INPUT) { ... }
              - pattern-not: |
                  $SECRET = get_option($KEY);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($INPUT == $SECRET) { ... }
              - pattern-not: |
                  $SECRET = get_option($KEY);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($SECRET === $INPUT) { ... }
              - pattern-not: |
                  $SECRET = get_option($KEY);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($INPUT === $SECRET) { ... }
          # Scenario 2: expected value is a hardcoded empty-string literal, not a
          # runtime lookup — a fail-closed guard clause compares it against
          # externally-influenced data, so a request that omits/empties the
          # corresponding parameter satisfies the check unconditionally.
          - patterns:
              - pattern-either:
                  - pattern: |
                      $SECRET = '';
                      ...
                      if ($SECRET !== $INPUT) { ... }
                  - pattern: |
                      $SECRET = '';
                      ...
                      if ($INPUT !== $SECRET) { ... }
                  - pattern: |
                      $SECRET = '';
                      ...
                      if ($SECRET != $INPUT) { ... }
                  - pattern: |
                      $SECRET = '';
                      ...
                      if ($INPUT != $SECRET) { ... }
                  # Same shape, but the empty-literal assignment sits inside a
                  # preceding conditional branch (e.g. one arm of a dispatcher
                  # that special-cases an "internal-only" mode) rather than at
                  # the top level of the function — the common real-world idiom.
                  - pattern: |
                      if (...) {
                        ...
                        $SECRET = '';
                        ...
                      }
                      ...
                      if ($SECRET !== $INPUT) { ... }
                  - pattern: |
                      if (...) {
                        ...
                        $SECRET = '';
                        ...
                      }
                      ...
                      if ($INPUT !== $SECRET) { ... }
                  - pattern: |
                      if (...) {
                        ...
                        $SECRET = '';
                        ...
                      }
                      ...
                      if ($SECRET != $INPUT) { ... }
                  - pattern: |
                      if (...) {
                        ...
                        $SECRET = '';
                        ...
                      }
                      ...
                      if ($INPUT != $SECRET) { ... }
              - metavariable-regex:
                  metavariable: $SECRET
                  regex: (?i).*(nonce|secret|token|key|auth|password|expected|signature).*
              # Self-sentinel FP guard: $INPUT is itself the same empty-string
              # literal $SECRET was initialized to (a "was this variable ever
              # reassigned" sentinel idiom, e.g. a loop-local column-key flag:
              # `$col_key = ''; ... if ('' !== $col_key)`) — there is no
              # externally-influenced operand in this comparison to bypass,
              # regardless of whether the variable's name happens to contain
              # one of the regex terms above.
              - pattern-not: |
                  $SECRET = '';
                  ...
                  if ($SECRET !== '') { ... }
              - pattern-not: |
                  $SECRET = '';
                  ...
                  if ('' !== $SECRET) { ... }
              - pattern-not: |
                  $SECRET = '';
                  ...
                  if ($SECRET != '') { ... }
              - pattern-not: |
                  $SECRET = '';
                  ...
                  if ('' != $SECRET) { ... }
          # Scenario 3a: secret read from per-record metadata (get_post_meta()/
          # get_user_meta()/get_comment_meta()) rather than a site-wide option —
          # same empty-by-default risk when the meta key was never written.
          - patterns:
              - pattern-either:
                  - pattern: |
                      $SECRET = $FUNC($ID, $KEY, true);
                      ...
                      if ($SECRET === $INPUT) { ... }
                  - pattern: |
                      $SECRET = $FUNC($ID, $KEY, true);
                      ...
                      if ($INPUT === $SECRET) { ... }
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(get_post_meta|get_user_meta|get_comment_meta)$
              - metavariable-regex:
                  metavariable: $KEY
                  regex: .*(?:secret|key|token|api_key|license|auth|password|salt|signing).*
              - pattern-not: |
                  $SECRET = $FUNC($ID, $KEY, true);
                  ...
                  if (! empty($SECRET) && $SECRET === $INPUT) { ... }
              - pattern-not: |
                  $SECRET = $FUNC($ID, $KEY, true);
                  ...
                  if (! empty($SECRET) && $INPUT === $SECRET) { ... }
              - pattern-not: |
                  $SECRET = $FUNC($ID, $KEY, true);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($SECRET === $INPUT) { ... }
              - pattern-not: |
                  $SECRET = $FUNC($ID, $KEY, true);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($INPUT === $SECRET) { ... }
          # Scenario 3b: secret read via a stored object's own accessor method
          # (e.g. an order/subscription verification key retrieved through its
          # get_meta() call) rather than a procedural get_option()/get_*_meta().
          - patterns:
              - pattern-either:
                  - pattern: |
                      $SECRET = $OBJ->get_meta($KEY, ...);
                      ...
                      if ($SECRET === $INPUT) { ... }
                  - pattern: |
                      $SECRET = $OBJ->get_meta($KEY, ...);
                      ...
                      if ($INPUT === $SECRET) { ... }
              - metavariable-regex:
                  metavariable: $KEY
                  regex: .*(?:secret|key|token|api_key|license|auth|password|salt|signing).*
              - pattern-not: |
                  $SECRET = $OBJ->get_meta($KEY, ...);
                  ...
                  if (! empty($SECRET) && $SECRET === $INPUT) { ... }
              - pattern-not: |
                  $SECRET = $OBJ->get_meta($KEY, ...);
                  ...
                  if (! empty($SECRET) && $INPUT === $SECRET) { ... }
              - pattern-not: |
                  $SECRET = $OBJ->get_meta($KEY, ...);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($SECRET === $INPUT) { ... }
              - pattern-not: |
                  $SECRET = $OBJ->get_meta($KEY, ...);
                  ...
                  if (empty($SECRET)) { ... }
                  ...
                  if ($INPUT === $SECRET) { ... }
              # Variant: the missing empty($SECRET) guard is safe when $INPUT itself
              # has a prior !empty($INPUT) guard in an enclosing condition — an
              # empty-by-default $SECRET can never satisfy === against a guaranteed
              # non-empty $INPUT.
              - pattern-not-inside: |
                  if (<... ! empty($INPUT) ...>) {
                    ...
                  }
          # Scenario 4: secret read via array-key access chained directly onto
          # get_option() — one settings option holding several fields, with the
          # secret nested under a single key — rather than a bare get_option($KEY)
          # return. Matches the fully inline chain and an intermediate-variable
          # assignment of the indexed value; bare-expression form (not only
          # wrapped in an if-statement) so it also matches nested inside a
          # larger boolean expression.
          - patterns:
              - pattern-either:
                  - pattern: get_option($OPT)[$KEY] == $INPUT
                  - pattern: $INPUT == get_option($OPT)[$KEY]
                  - pattern: get_option($OPT)[$KEY] === $INPUT
                  - pattern: $INPUT === get_option($OPT)[$KEY]
                  - pattern: |
                      $SECRET = get_option($OPT)[$KEY];
                      ...
                      if ($SECRET == $INPUT) { ... }
                  - pattern: |
                      $SECRET = get_option($OPT)[$KEY];
                      ...
                      if ($INPUT == $SECRET) { ... }
              - metavariable-regex:
                  metavariable: $KEY
                  regex: .*(?:secret|key|token|api_key|license|auth|password|salt|signing).*
              - pattern-not-inside: |
                  if (<... ! empty(get_option($OPT)[$KEY]) ...>) { ... }
              - pattern-not-inside: |
                  $SECRET = get_option($OPT)[$KEY];
                  ...
                  if (<... ! empty($SECRET) ...>) { ... }
