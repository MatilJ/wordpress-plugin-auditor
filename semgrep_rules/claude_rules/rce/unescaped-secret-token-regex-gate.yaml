rules:
  - id: claude.php.wordpress.rce.unescaped-secret-token-regex-gate
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      A secret/security-token constant or variable is concatenated directly
      into a PCRE pattern string passed to preg_match()/preg_match_all()/
      preg_replace()/preg_replace_callback() without first being escaped
      through preg_quote(). The token is meant to act as an exact-match
      authorization gate (e.g. a signed "dynamic content" tag embedded in
      page/comment content that must match a server-side secret before the
      matched payload is executed or included), but inserting it raw into
      the pattern means any regex metacharacters in its value are
      interpreted as regex syntax instead of matched literally, and a
      boolean-typed secret coerces to the single character "1", which then
      matches almost anything. This silently turns an intended unguessable
      secret comparison into a loose, partially-predictable match, letting
      an attacker who can influence the matched content reach whatever the
      gate was protecting (commonly eval()/include() of the captured text).
      CWE-94: Code Injection.
      Fix: wrap the secret in preg_quote($SECRET, $DELIMITER) before
      interpolating it into the pattern, and reject empty or
      trivially-guessable secret values before treating a match as
      authorized.
    metadata:
      category: security
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      likelihood: LOW
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Code Injection"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://www.php.net/manual/en/function.preg-quote.php
    pattern-sources:
      - patterns:
          - pattern: $SECRET
          # Restricted to bare, all-caps constant-style names (the
          # conventional shape of a wp-config.php-defined shared secret,
          # e.g. define('...SECURITY', ...)) rather than any identifier
          # merely containing the keyword, so a lowercase local variable
          # a fix assigns the preg_quote()-escaped result to (which often
          # keeps a similar name) is not re-flagged as a fresh source.
          - metavariable-regex:
              metavariable: $SECRET
              regex: "^[A-Z0-9_]*(SECRET|SECURITY|TOKEN)[A-Z0-9_]*$"
    pattern-sinks:
      - pattern-either:
          - pattern: preg_match($PAT, ...)
          - pattern: preg_match_all($PAT, ...)
          - pattern: preg_replace($PAT, ..., ...)
          - pattern: preg_replace_callback($PAT, ..., ...)
    pattern-sanitizers:
      - pattern: preg_quote(...)
