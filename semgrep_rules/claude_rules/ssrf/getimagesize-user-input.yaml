rules:
  - id: claude.php.wordpress.ssrf.getimagesize-user-input
    mode: taint
    languages: [php]
    severity: MEDIUM
    message: |
      User-controlled value flows into getimagesize(). When the argument is a
      remote URL (http:// or https://), PHP makes an HTTP request to fetch the
      image headers. There is no built-in IP range blocking — an attacker can
      supply http://169.254.169.254/latest/meta-data/ to probe cloud metadata
      endpoints, or target internal services on any port (CWE-918).
      Note: getimagesize() on a local file path does NOT make a network request.
      Validate the URL with wp_http_validate_url() before calling getimagesize()
      with user-controlled input, or ensure the argument is always a local path.
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory: vuln
      vulnerability_class: "Server-Side Request Forgery (SSRF)"
      technology: [php, wordpress]
      references:
        - https://www.php.net/manual/en/function.getimagesize.php
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-propagators:
      - pattern: wp_unslash($SRC)
        from: $SRC
        to: $RETURN
      - pattern: json_decode($SRC, ...)
        from: $SRC
        to: $RETURN
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: file_get_contents("php://input")
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_params(...)
          - pattern: $REQUEST->get_body_params(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body()
    pattern-sanitizers:
      - pattern-either:
          - pattern: wp_http_validate_url(...)
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: intval(...)
          - pattern: absint(...)
          - pattern: floatval(...)
          - pattern: sanitize_key(...)
          - pattern: sanitize_title(...)
          - pattern: sanitize_html_class(...)
          - pattern: sanitize_file_name(...)
          # WP Core media accessors: both always resolve to a path/URL the
          # caller cannot arbitrarily direct — get_avatar_url() derives its
          # URL from WP's own hashing over a user/email/comment identity, and
          # wp_get_original_image_path() looks up the already-stored
          # _wp_attached_file postmeta for an attachment ID. An attacker-
          # supplied ID selects WHICH existing attachment/avatar is resolved,
          # never an arbitrary attacker-chosen host.
          - pattern: get_avatar_url(...)
          - pattern: wp_get_original_image_path(...)
      # Named-resolver delegation: a static or instance method whose own name
      # signals validation (contains safe/valid/sanitiz/is_allowed) is called
      # with the tainted value and its return is trusted directly. Ordinary
      # flow-sensitive taint tracking (not a function-wide exclusion) still
      # re-taints the variable if a later, separate assignment in the same
      # function reintroduces raw request data.
      - patterns:
          - pattern-either:
              - pattern: $OBJ::$METHOD(...)
              - pattern: $OBJ->$METHOD(...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: "(?i).*(safe|valid|sanitiz|is_allowed).*"
    pattern-sinks:
      - patterns:
          - pattern: getimagesize($URL, ...)
          - focus-metavariable: $URL
