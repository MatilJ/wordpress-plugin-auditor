rules:
  - id: claude.php.wordpress.ssrf.get-headers-user-input
    mode: taint
    languages: [php]
    severity: MEDIUM
    message: |
      User-controlled URL flows into PHP's get_headers() function. get_headers()
      makes an HTTP HEAD (or GET, depending on context) request to the specified
      URL without any IP range blocking. An attacker can target internal services,
      cloud metadata endpoints (169.254.169.254), or perform port scanning via
      response timing (CWE-918).
      Validate the URL with wp_http_validate_url() before calling get_headers(),
      or use wp_safe_remote_head() instead (noting the 169.254.0.0/16 gap).
    metadata:
      category: security
      cwe: "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp: "A10:2021 - Server-Side Request Forgery"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory: vuln
      vulnerability_class: "Server-Side Request Forgery (SSRF)"
      technology: [php, wordpress]
      references:
        - https://www.php.net/manual/en/function.get-headers.php
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
    pattern-propagators:
      - pattern: wp_unslash($SRC)
        from: $SRC
        to: $RETURN
      - pattern: json_decode($SRC, ...)
        from: $SRC
        to: $RETURN
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: file_get_contents("php://input")
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_params(...)
          - pattern: $REQUEST->get_body_params(...)
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body()
    pattern-sanitizers:
      - pattern-either:
          - pattern: wp_http_validate_url(...)
          - pattern: urlencode(...)
          - pattern: rawurlencode(...)
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: intval(...)
          - pattern: absint(...)
          - pattern: floatval(...)
          - pattern: sanitize_key(...)
          - pattern: sanitize_title(...)
          - pattern: sanitize_html_class(...)
    pattern-sinks:
      - patterns:
          - pattern: get_headers($URL, ...)
          - focus-metavariable: $URL
