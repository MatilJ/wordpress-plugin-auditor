rules:
  - id: claude.php.wordpress.info-disclosure.db-credentials-plaintext-file-write
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      A WordPress DB credential constant (DB_PASSWORD) is embedded into a data
      structure that is serialized and written to a file (file_put_contents,
      a WP_Filesystem-style put_contents() wrapper, or fwrite) without first
      passing through any encryption call. Backup/clone/staging/migration
      features that bundle DB credentials or auth tokens into a file for later
      retrieval must encrypt that payload before it touches disk — when the
      destination path is predictable (derived from a truncated key/slug) or
      sits under a web-accessible directory, an unauthenticated attacker can
      read the plaintext secret. If that same secret also gates a separate
      write/upload endpoint, the disclosure escalates into unauthenticated
      arbitrary file write.
    metadata:
      category: security
      cwe: "CWE-312: Cleartext Storage of Sensitive Information"
      owasp: "A02:2021 - Cryptographic Failures"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Sensitive Data Exposure"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/312.html
    pattern-sources:
      - pattern: DB_PASSWORD
    pattern-sanitizers:
      - pattern-either:
          - pattern: openssl_encrypt(...)
          - pattern: sodium_crypto_secretbox(...)
          - pattern: mcrypt_encrypt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: file_put_contents($PATH, $DATA)
              - pattern: $FS->put_contents($PATH, $DATA)
              - pattern: fwrite($FH, $DATA)
          - focus-metavariable: $DATA
