rules:
  - id: claude.php.wordpress.info-disclosure.api-response-pagination-url-credential-leak
    languages: [php]
    severity: HIGH
    message: |
      A 'paging'/'next'-style field from a decoded third-party API HTTP
      response is copied verbatim into a result variable, with no
      redaction of embedded credentials anywhere in the enclosing
      function. Many OAuth-based REST APIs (e.g. the Instagram/Facebook
      Graph API, and similarly-shaped integrations) embed the caller's own
      access_token as a query parameter inside the "next page" pagination
      cursor URL they return. Propagating that field to any client-facing
      output — a JSON AJAX/REST response, or directly into rendered page
      HTML/attributes — discloses the live credential to whoever can reach
      that output, independent of whatever authorization gates the
      endpoint itself (CWE-200 / CWE-522).

      Escaping functions (esc_attr(), esc_url(), wp_json_encode()) do NOT
      neutralize this — they encode the string for its output context but
      leave the embedded token fully present and extractable.

      Fix: strip the credential from the URL before it leaves server-side
      code, e.g. remove_query_arg('access_token', $next_url), or rebuild
      the cursor from its own pagination parameters (cursor/after ID)
      instead of forwarding the third-party API's own next-page URL as-is.

      TRIAGE:
      1. Confirm $SRC is genuinely a decoded response from an OUTBOUND
         third-party API call (wp_remote_get/post + json_decode), not the
         plugin's own internally-generated pagination structure.
      2. Confirm the target API's pagination scheme actually embeds a
         credential in the URL (standard for OAuth Bearer-in-query-string
         APIs; not universal — some APIs use opaque cursor IDs only).
      3. Trace the assigned variable forward to its eventual output sink
         (may be in a different function/file than the assignment this
         rule flags) — an AJAX/REST JSON response, or unescaped/esc_attr()'d
         page HTML, confirms exploitability; a value that is re-parsed and
         only a specific non-credential field (e.g. just the cursor ID) is
         extracted before output is not exploitable.
    metadata:
      category: security
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
        - "CWE-522: Insufficiently Protected Credentials"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      likelihood: LOW
      impact: HIGH
      subcategory: audit
      vulnerability_class: "Sensitive Data Exposure"
      technology: [php, wordpress]
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://cwe.mitre.org/data/definitions/522.html
        - https://developers.facebook.com/docs/graph-api/results/#paging
    patterns:
      - pattern-either:
          - pattern: $RESULT['paging'] = $SRC->paging;
          - pattern: $RESULT->paging = $SRC->paging;
          - pattern: $RESULT['paging'] = $SRC['paging'];
          - pattern: $RESULT['next'] = $SRC->paging->next;
          - pattern: $RESULT['next_url'] = $SRC->paging->next;
          - pattern: $RESULT->next_url = $SRC->paging->next;
          - pattern: $RESULT['next_url'] = $SRC['paging']['next'];
          - pattern: $RESULT->next = $SRC->paging->next;
      # No remove_query_arg() call anywhere in the enclosing function — the
      # value reaches $RESULT exactly as the third-party API returned it.
      # remove_query_arg() is WP's own purpose-built query-string-stripping
      # function, specific enough that its mere presence in the function is
      # a meaningful redaction signal. preg_replace()/str_replace() are
      # deliberately NOT used as function-wide exclusions here — both are
      # generic string functions commonly present in the same function for
      # entirely unrelated purposes (e.g. trimming an image URL's size
      # suffix), and a function-wide pattern-not-inside on either produced
      # a false negative on confirmed real-world vulnerable code.
      - pattern-not-inside: |
          function $F(...) {
            ...
            <... remove_query_arg(...) ...>;
            ...
          }
      # Direct-wrap redaction forms: the assignment's own RHS passes the
      # source through a redaction call rather than copying it verbatim.
      - pattern-not: $RESULT['paging'] = preg_replace(...);
      - pattern-not: $RESULT->paging = preg_replace(...);
      - pattern-not: $RESULT['next'] = preg_replace(...);
      - pattern-not: $RESULT->next = preg_replace(...);
      - pattern-not: $RESULT['next_url'] = preg_replace(...);
      - pattern-not: $RESULT->next_url = preg_replace(...);
      - pattern-not: $RESULT['paging'] = str_replace(...);
      - pattern-not: $RESULT->paging = str_replace(...);
      - pattern-not: $RESULT['next'] = str_replace(...);
      - pattern-not: $RESULT->next = str_replace(...);
      - pattern-not: $RESULT['next_url'] = str_replace(...);
      - pattern-not: $RESULT->next_url = str_replace(...);
    paths:
      exclude:
        - "**/vendor/**"
        - "**/node_modules/**"
