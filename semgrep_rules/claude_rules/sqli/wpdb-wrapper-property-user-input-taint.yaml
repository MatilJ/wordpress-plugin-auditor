rules:
  - id: claude.php.wordpress.sqli.wpdb-wrapper-property-user-input-taint
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      User-controlled input reaches a SQL execution method called through an
      ALIASED/WRAPPED $wpdb handle (e.g. $this->wpdb->, $this->db->,
      $GLOBALS['wpdb']->) without going through prepare() with a placeholder,
      an integer cast, or an allowlist validator. This is SQL injection
      (CWE-89). Plugins commonly stash the global $wpdb in an object property
      (global $wpdb; $this->wpdb = $wpdb;) and run queries through the alias;
      these sinks are invisible to rules that match only the literal "$wpdb->".
      Use prepare() with %d/%s/%f/%i placeholders and pass variables separately.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "SQL Injection"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/classes/wpdb/#protect-queries-against-sql-injection-attacks
      # WHY THIS RULE EXISTS — companion to wpdb-query-user-input-taint, which
      # only matches the literal "$wpdb->" receiver. Empirically, the aliased
      # form ($this->wpdb-> / $this->db-> / $GLOBALS['wpdb']->) is extremely
      # common: 338+ occurrences across the audited plugin corpus. Confirmed
      # wrapper: better-search-replace BSR_DB does `global $wpdb; $this->wpdb =
      # $wpdb;` then `$this->wpdb->get_var("SELECT COUNT(*) FROM `$table`")`.
      #
      # TRIAGE: confirm the property genuinely holds $wpdb (look for
      # `$this->db = $wpdb;` or similar in the constructor) and that user input
      # actually reaches the query. $this->db may also be a non-$wpdb handle
      # (PDO/mysqli) — still a SQL sink, triage accordingly.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: filter_input(...)
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_params()
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: $REQUEST->get_query_params()
          # REST request ArrayAccess ($request['param']) — constrained to
          # request-named variables. A bare "$VAR['key']" source matches every
          # config/args array and function-parameter array (e.g. $template['col'],
          # $filters['id']), which floods this rule with false positives.
          - patterns:
              - pattern: $REQ[$KEY]
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|rest_request|wp_request|the_request)$
          # WP_Query query vars — the $wp_query global, or a WP_Query-named local.
          # Constrained so arbitrary $obj->get() calls are not taint sources.
          - pattern: $wp_query->get(...)
          - patterns:
              - pattern: $QV->get(...)
              - metavariable-regex:
                  metavariable: $QV
                  regex: ^\$(wp_query|query|the_query|wpq|custom_query|main_query|posts_query)$
          - pattern: get_query_var(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $this->wpdb->$METHOD($Q, ...)
              - pattern: $this->db->$METHOD($Q, ...)
              - pattern: $this->dbh->$METHOD($Q, ...)
              - pattern: $this->database->$METHOD($Q, ...)
              - pattern: $OBJ->wpdb->$METHOD($Q, ...)
              - pattern: $OBJ->db->$METHOD($Q, ...)
              - pattern: $OBJ->dbh->$METHOD($Q, ...)
              - pattern: $OBJ->database->$METHOD($Q, ...)
              - pattern: $GLOBALS['wpdb']->$METHOD($Q, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(query|get_results|get_row|get_var|get_col)$
          - focus-metavariable: $Q
    pattern-sanitizers:
      # Parameterized queries through the wrapper or bare $wpdb, and SQL escaping.
      - pattern: $wpdb->prepare(...)
      - pattern: $this->wpdb->prepare(...)
      - pattern: $this->db->prepare(...)
      - pattern: $this->dbh->prepare(...)
      - pattern: $this->database->prepare(...)
      - pattern: $OBJ->wpdb->prepare(...)
      - pattern: $OBJ->db->prepare(...)
      - pattern: $OBJ->dbh->prepare(...)
      - pattern: $OBJ->database->prepare(...)
      - pattern: $GLOBALS['wpdb']->prepare(...)
      - pattern: esc_sql(...)
      # Numeric casts: no SQL metacharacters possible
      - pattern: (int) $X
      - pattern: (float) $X
      - pattern: intval(...)
      - pattern: absint(...)
      - pattern: floatval(...)
      # sanitize_key: [a-z0-9_-] only — no SQL metacharacters
      - pattern: sanitize_key(...)
      # sanitize_sql_orderby: allowlist regex, false on invalid — safe for ORDER BY
      - pattern: sanitize_sql_orderby(...)
      # Array-level numeric sanitization (safe for IN() and numeric columns)
      - pattern: array_map('absint', ...)
      - pattern: array_map('intval', ...)
      - pattern: array_map('floatval', ...)
      - pattern: array_map('sanitize_key', ...)
      - pattern: map_deep($X, 'absint')
      - pattern: map_deep($X, 'intval')
      - pattern: map_deep($X, 'sanitize_key')
      # wp_parse_id_list() → array of non-negative integers
      - pattern: wp_parse_id_list(...)
      # array_fill() builds a "%d,%d,..." placeholder string for a dynamic IN()
      # clause (the standard SAFE pattern) — its output is only placeholders, so
      # taint flowing through count()->array_fill() is a false positive.
      - pattern: array_fill(...)
      # sanitize_title() → [a-z0-9%-_] only
      - pattern: sanitize_title(...)
      # DateTime/strtotime: output cannot carry SQL metacharacters
      - pattern: new DateTime(...)
      - pattern: new DateTimeImmutable(...)
      - pattern: strtotime(...)
      # NOTE: sanitize_text_field / esc_attr / esc_url_raw / wp_unslash are NOT
      # sanitizers — see wpdb-query-user-input-taint for the rationale.
