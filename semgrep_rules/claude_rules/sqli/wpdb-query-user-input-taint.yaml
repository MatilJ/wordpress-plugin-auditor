rules:
  - id: claude.php.wordpress.sqli.wpdb-query-user-input-taint
    mode: taint
    languages: [php]
    severity: HIGH
    message: |
      User-controlled input reaches $wpdb->query / get_results / get_row /
      get_var / get_col without going through $wpdb->prepare() with a
      placeholder, an integer cast, or an allowlist validator.
      This is SQL injection (CWE-89). Use $wpdb->prepare() with %d/%s/%f
      placeholders and pass variables as separate arguments.
    metadata:
      category: security
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp: "A03:2021 - Injection"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory: vuln
      vulnerability_class: "SQL Injection"
      technology: [php, wordpress]
      references:
        - https://developer.wordpress.org/reference/classes/wpdb/#protect-queries-against-sql-injection-attacks
      # KNOWN LIMITATION — cross-file predicate extraction pattern:
      #   This rule MISSES SQL injection where user input passes through a
      #   namespace-qualified helper function defined in a separate file before
      #   reaching the SQL string. Semgrep taint does not cross file boundaries.
      #
      #   Pattern NOT caught (confirmed TP: check-email 2.0.13.2 lines 264–322):
      #     $search_term = sanitize_text_field(wp_unslash($request['s']));
      #     $predicates = Util\wp_chill_check_email_get_advanced_search_term_predicates($search_term);
      #     foreach ($predicates as $col => $email) {
      #         $query_cond .= "id = '$email'";   // $email is user-controlled
      #     }
      #     $wpdb->get_results($query . $query_cond);
      #
      #   The function call `Util\some_helper($search_term)` creates an opaque
      #   boundary. The taint chain: $_GET['s'] → sanitize_text_field() → helper()
      #   → returned array value → string interpolation → get_results() is invisible
      #   to Semgrep when the helper is defined in a different file.
      #
      #   Manual audit guidance: when reviewing search/filter functionality, look for:
      #   1. Plugin-defined "advanced search" or "predicate" helper functions that
      #      extract values from a sanitize_text_field()-processed search term.
      #   2. The returned values being directly interpolated into SQL strings (not
      #      passed to $wpdb->prepare() or esc_sql()).
      #   3. The safe path often uses $wpdb->esc_like() + prepare() — verify the
      #      ADVANCED search path (activated by e.g. colon syntax like "id:X") uses
      #      the same escaping, not just the standard search path.
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_SERVER
          - pattern: $_FILES
          - pattern: file_get_contents("php://input")
          - pattern: filter_input(...)
          # REST API: WP_REST_Request objects carry user-supplied parameters.
          # CVE evidence: CVE-2026-4352 (JetEngine CCT REST endpoint),
          # CVE-2026-2412 (QSM REST API merged_question parameter).
          - pattern: $REQUEST->get_param(...)
          - pattern: $REQUEST->get_params()
          - pattern: $REQUEST->get_json_params()
          - pattern: $REQUEST->get_body_params()
          - pattern: $REQUEST->get_query_params()
          # REST request ArrayAccess ($request['param']) — constrained to
          # request-named variables. A bare "$VAR['key']" source matches every
          # config/args array and function-parameter array (e.g. $template['col'],
          # $filters['id']), producing false positives in taint mode.
          - patterns:
              - pattern: $REQ[$KEY]
              - metavariable-regex:
                  metavariable: $REQ
                  regex: ^\$(request|req|rest_request|wp_request|the_request)$
          # WP_Query: query vars populated by rewrite rules carry URL-derived values.
          # $wp_query global, or a WP_Query-named local; constrained so arbitrary
          # $obj->get() calls are not taint sources.
          - pattern: $wp_query->get(...)
          - patterns:
              - pattern: $QV->get(...)
              - metavariable-regex:
                  metavariable: $QV
                  regex: ^\$(wp_query|query|the_query|wpq|custom_query|main_query|posts_query)$
          - pattern: get_query_var(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $wpdb->query($Q, ...)
              - pattern: $wpdb->get_results($Q, ...)
              - pattern: $wpdb->get_row($Q, ...)
              - pattern: $wpdb->get_var($Q, ...)
              - pattern: $wpdb->get_col($Q, ...)
          - focus-metavariable: $Q
    pattern-sanitizers:
      - pattern-either:
          # SQL-specific: parameterized queries and SQL escaping
          - pattern: $wpdb->prepare(...)
          - pattern: esc_sql(...)
          # Numeric casts: no SQL metacharacters possible
          - pattern: (int) $X
          - pattern: (float) $X
          - pattern: intval(...)
          - pattern: absint(...)
          - pattern: floatval(...)
          # sanitize_key: [a-z0-9_-] only — no SQL metacharacters
          - pattern: sanitize_key(...)
          # sanitize_sql_orderby: returns only the first valid column name from an
          # allowlist of [a-z0-9_] characters, or an empty string for invalid input.
          # Safe for direct use in ORDER BY `column` constructions.
          - pattern: sanitize_sql_orderby(...)
          # Array-level numeric sanitization (safe for IN() and numeric columns)
          - pattern: array_map('absint', ...)
          - pattern: array_map('intval', ...)
          - pattern: array_map('floatval', ...)
          - pattern: array_map('sanitize_key', ...)
          # map_deep() — recursive variant of array_map for nested arrays/objects
          - pattern: map_deep($X, 'absint')
          - pattern: map_deep($X, 'intval')
          - pattern: map_deep($X, 'sanitize_key')
          # wp_parse_id_list() → array_unique(array_map('absint', ...))
          # Always returns an array of non-negative integers.
          - pattern: wp_parse_id_list(...)
          # sanitize_title() → [a-z0-9%-_] only — no SQL metacharacters
          - pattern: sanitize_title(...)
          # DateTime/DateTimeImmutable: constructor throws Exception on invalid
          # date strings (SQL payloads are not valid dates), and ->format()
          # outputs only date components (digits, dashes, colons, spaces).
          # SQL metacharacters cannot survive this transform.
          - pattern: new DateTime(...)
          - pattern: new DateTimeImmutable(...)
          # strtotime(): always returns an integer (Unix timestamp) or false.
          # Neither int nor bool can carry SQL metacharacters.
          - pattern: strtotime(...)
          # NOTE: sanitize_text_field, sanitize_email, strip_tags etc. are NOT here.
          # They strip HTML but pass single quotes, semicolons, and spaces through,
          # which are sufficient for ORDER BY injection and unquoted numeric injection.
          #
          # NOTE: wp_unslash() is NOT a sanitizer — it REMOVES the addslashes()
          # protection that WordPress auto-applies to superglobals via wp_magic_quotes().
          # Calling wp_unslash() before SQL concatenation re-enables quote breakout.
          #
          # NOTE: esc_attr() and esc_url_raw() are NOT SQL sanitizers.
          # esc_attr() encodes HTML entities (& < > " ') only — parentheses,
          # semicolons, SQL functions, and boolean operators pass through unchanged.
          # esc_url_raw() validates URL structure only — single quotes survive in
          # path/query components. Neither provides SQL injection protection.
